spring:
  lifecycle:
    timeout-per-shutdown-phase: 20s
  application:
    name: ayni-notification-service

  # ─── Base de datos ───────────────────────────────────────────────────────
  # Los valores por defecto permiten arrancar contra la infraestructura del
  # docker compose sin exportar nada. En contenedor los sobreescribe el entorno.
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/ayni}
    username: ${SPRING_DATASOURCE_USERNAME:ayni_app}
    password: ${SPRING_DATASOURCE_PASSWORD:cambiar_en_local}
    hikari:
      pool-name: ayni-notification-service-pool
      maximum-pool-size: 10

  # Cada servicio migra unicamente su propio schema. Ningun servicio lee ni
  # altera tablas de otro: esa frontera es el limite del bounded context.
  flyway:
    enabled: true
    schemas: notification
    default-schema: notification
    locations: classpath:db/migration
    validate-on-migrate: true
    # Nunca baseline automatico: si el schema tiene objetos que Flyway no
    # registro, queremos enterarnos, no que los de por buenos en silencio.
    baseline-on-migrate: false

  # El esquema lo define Flyway y solo Flyway; que un ORM altere tablas por su
  # cuenta es inaceptable en un sistema financiero. Ver §4.5 del documento de diseño.
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    properties:
      hibernate:
        default_schema: notification

  rabbitmq:
    host: ${SPRING_RABBITMQ_HOST:localhost}
    port: ${SPRING_RABBITMQ_PORT:5672}
    username: ${SPRING_RABBITMQ_USERNAME:ayni}
    password: ${SPRING_RABBITMQ_PASSWORD:cambiar_en_local}
    listener:
      simple:
        # Igual que en core-banking: unos pocos reintentos con espera creciente y
        # despues se descarta, en lugar de un mensaje envenenado en bucle.
        default-requeue-rejected: false
        retry:
          enabled: true
          max-attempts: 5
          initial-interval: 2s
          multiplier: 2

ayni:
  notificaciones:
    despacho:
      # Cada cuanto se buscan avisos pendientes. Es la demora maxima de un correo.
      cada: ${AYNI_NOTIFICACIONES_DESPACHO:5s}
    reintentos:
      # Espera tras el primer fallo; se duplica en cada intento (30 s, 1 min, 2 min...).
      base: ${AYNI_NOTIFICACIONES_REINTENTO_BASE:30s}
      # Intentos en total antes de dar el aviso por fallido.
      maximo: ${AYNI_NOTIFICACIONES_REINTENTOS:5}
  # ─── Correo al cliente (solo perfil prod, Amazon SES) ──────────────────
  correo:
    remitente: ${AYNI_CORREO_REMITENTE:Ayni Bank <no-responder@ayni.pe>}
    region: ${AYNI_CORREO_REGION:us-east-1}

server:
  port: 8083
  # Apagado ordenado (ISO/IEC 25010, coexistencia). Ante SIGTERM el servidor deja de
  # aceptar peticiones nuevas y espera a que terminen las que estan en curso; despues se
  # cierran el pool de conexiones y los consumidores de RabbitMQ. Docker espera 30 s
  # (stop_grace_period) antes de matar el proceso, mas que los 20 s de abajo.
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  # Histograma de latencias para calcular el p95 en Grafana, y el nombre del
  # servicio como etiqueta comun de todas las metricas (AYNI-159).
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true
    tags:
      application: ${spring.application.name}
  endpoint:
    health:
      probes:
        enabled: true
  health:
    livenessState:
      enabled: true
    readinessState:
      enabled: true
