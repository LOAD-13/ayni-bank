spring:
  application:
    name: ayni-identity-service

  # ─── Base de datos ───────────────────────────────────────────────────────
  # Los valores por defecto permiten arrancar contra la infraestructura del
  # docker compose sin exportar nada. En contenedor los sobreescribe el entorno.
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/ayni}
    username: ${SPRING_DATASOURCE_USERNAME:ayni_app}
    password: ${SPRING_DATASOURCE_PASSWORD:cambiar_en_local}
    hikari:
      pool-name: ayni-identity-service-pool
      maximum-pool-size: 10

  # Cada servicio migra unicamente su propio schema. Ningun servicio lee ni
  # altera tablas de otro: esa frontera es el limite del bounded context.
  flyway:
    enabled: true
    schemas: identity
    default-schema: identity
    locations: classpath:db/migration
    validate-on-migrate: true
    # Nunca baseline automatico: si el schema tiene objetos que Flyway no
    # registro, queremos enterarnos, no que los de por buenos en silencio.
    baseline-on-migrate: false

  jpa:
    hibernate:
      # `none` explicito, no por omision. Spring Boot solo elige `create-drop`
      # con bases embebidas, asi que hoy el valor por defecto ya seria `none`;
      # se escribe igualmente porque de esta linea depende que un ORM no altere
      # el esquema de un sistema financiero, y eso no se deja a un valor por
      # defecto que otra version puede cambiar. Ver §4.5 del documento de diseño.
      ddl-auto: none
    # Sin esto, Hibernate mantiene la sesion abierta durante todo el renderizado
    # de la respuesta: las consultas perezosas se disparan fuera de la
    # transaccion, la conexion se retiene de mas y el problema aparece bajo
    # carga, no en desarrollo. Spring Boot lo avisa al arrancar por algo.
    open-in-view: false
    properties:
      hibernate:
        # Las entidades no escriben el schema en cada @Table. Si manana el
        # bounded context se muda a su propia base, se cambia aqui.
        default_schema: identity

# ─── Cifrado de datos personales en reposo ─────────────────────────────────
# Clave AES-256 en Base64, 32 bytes. Cifra el numero de documento declarado, que
# es dato sensible segun la Ley N.o 29733 (§5.2 del documento de diseño).
#
# El valor por defecto es de desarrollo y esta aqui para que el compose arranque
# sin exportar nada, igual que la contrasena de la base. En staging y produccion
# lo sobreescribe AYNI_CIFRADO_CLAVE, que llega como secreto y nunca al repo.
# Generar una nueva:  openssl rand -base64 32
ayni:
  cifrado:
    clave: ${AYNI_CIFRADO_CLAVE:YXluaS1jbGF2ZS1kZS1kZXNhcnJvbGxvLTMyYnl0ZXM=}

  # ─── Firma del token de acceso ─────────────────────────────────────────
  # Clave HS256 en Base64, mínimo 32 bytes. Es distinta de la de cifrado a
  # propósito: firmar y cifrar son finalidades distintas, y una clave que sirve
  # para las dos obliga a rotarlas juntas aunque solo se comprometa una.
  jwt:
    clave: ${AYNI_JWT_CLAVE:YXluaS1maXJtYS1kZS1kZXNhcnJvbGxvLTMyYnl0ZXM=}

  cookies:
    # En local la aplicación se sirve por HTTP, y una cookie `Secure` sencillamente
    # no llegaría: el navegador la descarta sin avisar y el ingreso parecería
    # funcionar hasta que la renovación falla. En staging y producción, con HTTPS
    # por delante, esto va SIEMPRE en true.
    seguras: ${AYNI_COOKIES_SEGURAS:false}

  # ─── Almacen de objetos (documentos KYC) ───────────────────────────────
  # El bucket ya existe: lo crea minio-init en docker-compose.yml, privado
  # (mc anonymous set none). Ver diseno-base.md §4.1.
  minio:
    endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
    access-key: ${MINIO_ACCESS_KEY:ayni_minio}
    secret-key: ${MINIO_SECRET_KEY:cambiar_en_local}
    bucket-kyc: ayni-kyc-documentos

  # ─── Cliente hacia kyc-service ──────────────────────────────────────────
  # AYNI_KYC_SERVICE_URL ya llega al contenedor desde docker-compose.yml.
  # El timeout de 10s (diseno-base.md §3.5) se fija en ConfiguracionDelClienteKyc,
  # no aqui: RestClient no lo expone como propiedad Spring estandar.
  kyc:
    base-url: ${AYNI_KYC_SERVICE_URL:http://localhost:8000}

# ─── Resiliencia de la llamada a kyc-service (AYNI-13 subtarea 10) ────────
# Ver ADR-0020 para la justificacion de estos valores.
resilience4j:
  # El orden por defecto de resilience4j-spring-boot3 2.4.0 NO es
  # CircuitBreaker-afuera/Retry-adentro (confirmado experimentalmente, ver
  # ADR-0020): sin fijarlo aqui, el fallback de CircuitBreaker absorbe la
  # excepcion en el PRIMER intento y Retry nunca llega a reintentar. Un
  # numero menor se ejecuta mas afuera (Spring AOP @Order estandar).
  circuitbreaker:
    circuit-breaker-aspect-order: 1
    instances:
      kycService:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 3
        automatic-transition-from-open-to-half-open-enabled: true
        record-exceptions:
          - org.springframework.web.client.HttpServerErrorException
          - org.springframework.web.client.ResourceAccessException
        # No evita que el fallback se dispare para un 4xx (eso lo maneja
        # AdaptadorVerificadorKyc.alAgotarLaResiliencia relanzando la
        # excepcion tal cual); solo evita que un 4xx cuente como fallo en
        # las metricas del circuito.
        ignore-exceptions:
          - org.springframework.web.client.HttpClientErrorException
  retry:
    retry-aspect-order: 2
    instances:
      kycService:
        max-attempts: 3
        wait-duration: 500ms
        enable-exponential-backoff: true
        exponential-backoff-multiplier: 2
        retry-exceptions:
          - org.springframework.web.client.HttpServerErrorException
          - org.springframework.web.client.ResourceAccessException
        # HttpClientErrorException (4xx, ej. UUID invalido) queda fuera a
        # proposito: reintentar una peticion mal formada no la arregla.

server:
  port: 8081

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  health:
    livenessState:
      enabled: true
    readinessState:
      enabled: true
