spring:
  application:
    name: ayni-gateway

  cloud:
    gateway:
      server:
        webflux:
          # El navegador habla SOLO con el gateway. Ningun servicio publica puerto en el
          # host, y eso no es una comodidad: es lo que garantiza que la validacion del
          # JWT, el CORS y la limitacion de tasa no se puedan esquivar llamando
          # directamente al servicio de detras.
          routes:
            # ── Limite de tasa · AYNI-160 ─────────────────────────────────────────
            # Propuesta del taller de seguridad de la semana 8. Van antes que las rutas
            # generales porque el gateway usa la primera que casa. Cada limite es una
            # cubeta de fichas en Redis: se repone una ficha por segundo y la peticion
            # cuesta N, asi que caben 60/N por minuto con una rafaga inicial de 5.
            # Al superarlo responde 429 con Retry-After.
            # Ingreso: 5/min por IP. Blanco de fuerza bruta y credential stuffing.
            - id: limite-ingreso
              uri: ${AYNI_IDENTITY_URI:http://ayni-identity-service:8081}
              predicates:
                - Method=POST
                - Path=/api/v1/sesion
              filters:
                - name: RequestRateLimiter
                  args:
                    key-resolver: "#{@porIp}"
                    redis-rate-limiter.replenishRate: 1
                    redis-rate-limiter.burstCapacity: 60
                    redis-rate-limiter.requestedTokens: 12

            # Codigos de segundo factor: 10/min. Seis digitos son solo un millon de combinaciones.
            - id: limite-segundo-factor
              uri: ${AYNI_IDENTITY_URI:http://ayni-identity-service:8081}
              predicates:
                - Method=POST
                - Path=/api/v1/sesion/segundo-factor,/api/v1/segundo-factor/desafio/*/verificar,/api/v1/usuarios/*/codigo/verificar
              filters:
                - name: RequestRateLimiter
                  args:
                    key-resolver: "#{@porIp}"
                    redis-rate-limiter.replenishRate: 1
                    redis-rate-limiter.burstCapacity: 30
                    redis-rate-limiter.requestedTokens: 6

            # Renovacion de sesion: 20/min por IP. Uso legitimo alto pero acotado.
            - id: limite-renovacion
              uri: ${AYNI_IDENTITY_URI:http://ayni-identity-service:8081}
              predicates:
                - Method=POST
                - Path=/api/v1/sesion/renovacion
              filters:
                - name: RequestRateLimiter
                  args:
                    key-resolver: "#{@porIp}"
                    redis-rate-limiter.replenishRate: 1
                    redis-rate-limiter.burstCapacity: 15
                    redis-rate-limiter.requestedTokens: 3

            # Registro: 3/min por IP. Frena el alta masiva de cuentas falsas.
            - id: limite-registro
              uri: ${AYNI_IDENTITY_URI:http://ayni-identity-service:8081}
              predicates:
                - Method=POST
                - Path=/api/v1/registro
              filters:
                - name: RequestRateLimiter
                  args:
                    key-resolver: "#{@porIp}"
                    redis-rate-limiter.replenishRate: 1
                    redis-rate-limiter.burstCapacity: 100
                    redis-rate-limiter.requestedTokens: 20

            # URL de subida del DNI y la selfie: 10/hora. Cada subida consume almacenamiento y OCR.
            - id: limite-subida-kyc
              uri: ${AYNI_IDENTITY_URI:http://ayni-identity-service:8081}
              predicates:
                - Method=POST
                - Path=/api/v1/solicitudes/*/documentos/url-de-subida
              filters:
                - name: RequestRateLimiter
                  args:
                    key-resolver: "#{@porIp}"
                    redis-rate-limiter.replenishRate: 1
                    redis-rate-limiter.burstCapacity: 3600
                    redis-rate-limiter.requestedTokens: 360

            # Operaciones con dinero: 10/min por titular. Se suma a la idempotencia.
            - id: limite-transferencias
              uri: ${AYNI_CORE_URI:http://ayni-core-banking-service:8082}
              predicates:
                - Method=POST
                - Path=/api/v1/transferencias,/api/v1/cuentas/mia/depositos-simulados
              filters:
                - name: RequestRateLimiter
                  args:
                    key-resolver: "#{@porUsuario}"
                    redis-rate-limiter.replenishRate: 1
                    redis-rate-limiter.burstCapacity: 30
                    redis-rate-limiter.requestedTokens: 6

            - id: identity
              uri: ${AYNI_IDENTITY_URI:http://ayni-identity-service:8081}
              predicates:
                # `/api/v1/registro` sin `/**` ademas de con el, porque el comodin de
                # Spring Cloud Gateway NO casa con la ruta desnuda: sin las dos formas,
                # un POST a `/api/v1/registro` devuelve 404 y el de
                # `/api/v1/registro/algo` funciona, que es de las cosas mas
                # desconcertantes de depurar.
                # `/api/v1/dev/**` encamina el disparador que aprueba una solicitud a
                # mano mientras no exista el OCR. El endpoint al que llega lleva
                # `@Profile("dev")`, asi que fuera de desarrollo esta ruta existe y no
                # resuelve a nada: el bean ni se crea. Se retira con HU-02.
                # `/api/v1/segundo-factor/**` faltaba: el desafio de segundo factor por
                # correo respondia 404 a traves del gateway (AYNI-160).
                - Path=/api/v1/registro,/api/v1/registro/**,/api/v1/sesion,/api/v1/sesion/**,/api/v1/dev/**,/api/v1/auth/**,/api/v1/usuarios/**,/api/v1/solicitudes/**,/api/v1/segundo-factor/**

            - id: core-banking
              uri: ${AYNI_CORE_URI:http://ayni-core-banking-service:8082}
              predicates:
                - Path=/api/v1/cuentas/**,/api/v1/transferencias,/api/v1/transferencias/**,/api/v1/tarjetas/**,/api/v1/tipo-cambio/**

            # Sin ruta hacia ayni-kyc-service, a proposito: es un servicio interno al que
            # solo llama identity-service (diseno-base.md §3.4). La ruta que habia
            # (`/api/v1/kyc/**`) no reescribia el prefijo y no llegaba a ningun endpoint,
            # pero de haberlo hecho habria expuesto a Internet la lectura de documentos
            # KYC por clave. Ver ADR-0028.

          globalcors:
            cors-configurations:
              "[/**]":
                # Lista explicita de origenes, nunca `*`. Con comodin no se pueden enviar
                # credenciales, y el refresh token viaja en cookie HttpOnly.
                allowedOrigins: ${AYNI_ORIGENES_PERMITIDOS:http://localhost:3000,http://localhost:3500}
                allowedMethods: [GET, POST, PUT, PATCH, DELETE, OPTIONS]
                allowedHeaders: ["*"]
                allowCredentials: true
                maxAge: 3600

  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}

ayni:
  jwt:
    # La misma clave con la que firma identity-service. El valor por defecto es el
    # de desarrollo de identity; en produccion llega como secreto (AYNI_JWT_CLAVE).
    clave: ${AYNI_JWT_CLAVE:YXluaS1maXJtYS1kZS1kZXNhcnJvbGxvLTMyYnl0ZXM=}
  seguridad:
    # Rutas que exigen un token de acceso valido, separadas por comas: todo lo que
    # muestra o mueve el dinero del titular. `cuentas/titular/**` queda fuera porque
    # la pantalla final del onboarding la consulta antes de que exista sesion.
    rutas-protegidas: >-
      /api/v1/cuentas/mia,/api/v1/cuentas/mia/**,/api/v1/transferencias,/api/v1/transferencias/**

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  # Histograma de latencias para calcular el p95 en Grafana, y el nombre del
  # servicio como etiqueta comun de todas las metricas (AYNI-159).
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true
    tags:
      application: ${spring.application.name}
  endpoint:
    health:
      probes:
        enabled: true
  # La salud del gateway no depende de Redis: si el contador cae, el limitador deja
  # pasar y el sistema sigue atendiendo. Que /api/health dijera DOWN por eso seria
  # disparar una reversion del despliegue por algo que no impide operar.
  health:
    redis:
      enabled: false
    livenessState:
      enabled: true
    readinessState:
      enabled: true
