
spring:
  lifecycle:
    timeout-per-shutdown-phase: 20s

  application:
    name: ayni-core-banking-service

  # Base de datos
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/ayni}
    username: ${SPRING_DATASOURCE_USERNAME:ayni_app}
    password: ${SPRING_DATASOURCE_PASSWORD:cambiar_en_local}
    hikari:
      pool-name: ayni-core-banking-service-pool
      maximum-pool-size: 10

  # Migraciones de base de datos
  flyway:
    enabled: true
    schemas: core
    default-schema: core
    locations: classpath:db/migration
    validate-on-migrate: true
    baseline-on-migrate: false

  # Configuracion JPA
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    properties:
      hibernate:
        default_schema: core

  # Mensajeria RabbitMQ
  rabbitmq:
    host: ${SPRING_RABBITMQ_HOST:localhost}
    port: ${SPRING_RABBITMQ_PORT:5672}
    username: ${SPRING_RABBITMQ_USERNAME:ayni}
    password: ${SPRING_RABBITMQ_PASSWORD:cambiar_en_local}
    listener:
      simple:
        default-requeue-rejected: false
        retry:
          enabled: true
          max-attempts: 5
          initial-interval: 2s
          multiplier: 2

ayni:
  # HU-07: Segundo factor de confirmacion
  confirmacion:
    clave: ${AYNI_CONFIRMACION_CLAVE:YXluaS1jb25maXJtYWNpb24tZGUtZGVzYXJyb2xsbzA=}

  cuentas:
    # Cuenta tecnica para depositos simulados
    fondeo-pen: f0de0000-0000-4000-8000-000000000001

    # Cuenta tecnica para intereses capitalizados HU-06
    intereses-pen: 1e7e0000-0000-4000-8000-000000000001

  # Devengo automatico de intereses
  devengo:
    cron: "${AYNI_DEVENGO_CRON:0 5 * * * *}"

  # Mantenimiento de particiones y datos
  mantenimiento:
    cron: "${AYNI_MANTENIMIENTO_CRON:0 30 3 * * *}"
    meses-de-antelacion: 3
    dias-de-outbox: 7
    dias-de-idempotencia: 30
    lote: 10000

  productos:
    ahorro-soles: ${AYNI_PRODUCTO_AHORRO_PEN:1}

  # AYNI-22: Camara de compensacion interbancaria
  camara:
    url: ${AYNI_CAMARA_URL:http://localhost:8082/simulador/camara/v1}

    # Tiempo maximo de espera de transferencia
    espera-maxima: ${AYNI_CAMARA_ESPERA:PT5M}

    # Frecuencia de conciliacion
    conciliacion-ms: ${AYNI_CAMARA_CONCILIACION_MS:15000}

# AYNI-22: Resilience4j
resilience4j:
  retry:
    instances:
      camara:
        maxAttempts: 3
        waitDuration: 250ms

  circuitbreaker:
    instances:
      camara:
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        failureRateThreshold: 50
        waitDurationInOpenState: 15s
        permittedNumberOfCallsInHalfOpenState: 3
        automaticTransitionFromOpenToHalfOpenEnabled: true

# Documentacion OpenAPI
# Apagada por defecto fuera del entorno habilitado
springdoc:
  api-docs:
    enabled: ${AYNI_API_DOCS:false}
  swagger-ui:
    enabled: false

server:
  port: 8082
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus

  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true
    tags:
      application: ${spring.application.name}

  endpoint:
    health:
      probes:
        enabled: true

  health:
    livenessState:
      enabled: true
    readinessState:
      enabled: true

---
# Datos de desarrollo
spring:
  config:
    activate:
      on-profile: dev
  flyway:
    locations: classpath:db/migration,classpath:db/seed
