# Configuración de Gitleaks para Ayni Bank.
#
# Hereda el conjunto de reglas por defecto —no lo sustituye— y añade encima una lista
# de excepciones. Sin `useDefault = true` este fichero DESACTIVARÍA todas las reglas y
# el escaneo pasaría siempre en verde, que es peor que no tenerlo.
[extend]
useDefault = true

[allowlist]
description = """
Excepciones revisadas una por una. Toda entrada de esta lista lleva el motivo escrito:
una excepción sin justificación es indistinguible de un secreto que alguien tapó.
"""

# ── Ejemplos de los contratos OpenAPI ──────────────────────────────────────
#
# El contrato de identity llevaba `tokenDeAcceso: eyJhbGciOiJIUzI1NiJ9...` como ejemplo
# de la respuesta de sesión. No es un secreto: es una cadena inventada para documentar la
# forma del campo. Pero tiene la entropía de un JWT real, y la regla `generic-api-key` la
# marca como credencial filtrada.
#
# El valor ya se sustituyó por un marcador en el árbol de trabajo. Esta excepción existe
# porque **Gitleaks escanea el historial del Pull Request, no su resultado**: el commit
# que introdujo la línea sigue ahí y seguiría marcándose. La alternativa era reescribir
# la historia de una rama ya publicada, que es peor remedio que la enfermedad.
#
# Se acota por huella exacta —commit, fichero, regla y línea— en lugar de excluir el
# directorio entero. Si mañana se filtra algo de verdad en `contracts/`, Gitleaks lo dirá.
[[allowlist.rules]]
description = "Ejemplo de JWT en el contrato de identity, commit ae57cd1. Ver contracts/identity-service.openapi.yaml"
[allowlist.rules.allowlist]
fingerprints = [
  "ae57cd11aa5c2bb656807c6f21bbc264930c7ed2:contracts/identity-service.openapi.yaml:generic-api-key:398",
]

# ── Claves de desarrollo ───────────────────────────────────────────────────
#
# `.env.example` y los `application.yml` traen valores por defecto para que el compose
# arranque sin exportar nada. Están escritos para ser leídos: `cambiar_en_local`,
# `ayni-clave-de-desarrollo-32bytes`. No protegen nada y en staging y producción los
# sustituyen secretos reales que nunca tocan el repositorio.
#
# Se listan por ruta y no por valor: así, si alguien pega una clave de verdad en uno de
# esos ficheros, la excepción también la taparía. Es el riesgo asumido, y el motivo de
# que la lista sea corta y explícita en lugar de un comodín sobre `**/*.yml`.
[[allowlist.rules]]
description = "Valores de desarrollo documentados, nunca secretos reales"
[allowlist.rules.allowlist]
paths = [
  '''\.env\.example$''',
  '''services/ayni-[a-z-]+/src/main/resources/application\.yml$''',
]
