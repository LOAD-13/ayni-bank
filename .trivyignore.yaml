# Excepciones del análisis de vulnerabilidades.
#
# CÓMO SE USA ESTE FICHERO
#
# Una excepción aquí NO significa «esta vulnerabilidad no importa». Significa
# que se evaluó su explotabilidad en este proyecto concreto, que se comprobó
# que no existe versión corregida publicada, y que la exclusión caduca en una
# fecha a partir de la cual Trivy vuelve a bloquear la integración.
#
# Toda entrada exige las cuatro cosas: identificador, por qué no es explotable
# aquí, por qué no se puede corregir hoy, y fecha de caducidad. Sin las cuatro,
# no entra. Es el plan de contingencia del riesgo R-16 de la matriz.

vulnerabilities:
  # ───────────────────────────────────────────────────────────────────────────
  # Spring Framework 6.2.19 · tres CRÍTICAS sin versión corregida en la rama 6.2
  #
  # Afectan a identity, core-banking y notification (spring-webmvc) y al gateway
  # (spring-webflux). Spring Boot 3.5.16 es la última 3.x y gestiona la 6.2.19,
  # que es también la última 6.2 publicada en Maven Central al 10 de octubre de
  # 2026. Trivy solo da por corregida la 7.0.9, que exige Spring Boot 4: un salto
  # de versión mayor que se planifica aparte (tarea de deuda técnica en Jira).
  #
  # NO SON EXPLOTABLES EN ESTA APLICACIÓN. Cada una exige una pieza que el
  # proyecto no usa:
  #
  #   · CVE-2026-47884 exige renderizar vistas con XsltView. No hay vistas: todos
  #     los controladores son @RestController y devuelven JSON.
  #   · CVE-2026-47890 exige Server-Sent Events con fragmentos de vista. No hay SSE.
  #   · CVE-2026-47892 exige endpoints funcionales de WebFlux (RouterFunction). El
  #     gateway enruta con Spring Cloud Gateway, sin RouterFunction propios.
  #
  # Verificable con:
  #   grep -rnE "XsltView|FragmentsRendering|ServerSentEvent|SseEmitter|RouterFunction|RequestPredicates" services/*/src/main
  #
  # QUÉ HACER AL LLEGAR LA FECHA. Comprobar si hay una 6.2.x corregida en Maven
  # Central o si la migración a Spring Boot 4 ya está hecha. Si no, repetir la
  # comprobación de arriba y renovar la caducidad dejando constancia.
  # ───────────────────────────────────────────────────────────────────────────

  - id: CVE-2026-47884
    statement: >-
      SSRF y ejecución remota mediante XsltView en Spring MVC. El proyecto no
      renderiza vistas: todos los controladores son REST y no se usa XsltView.
      Sin versión 6.2.x corregida publicada al 10 de octubre de 2026.
    expired_at: 2026-11-10

  - id: CVE-2026-47890
    statement: >-
      Corrupción del flujo de Server-Sent Events con fragmentos de vista en
      Spring MVC y WebFlux. El proyecto no usa SSE ni fragmentos de vista. Sin
      versión 6.2.x corregida publicada al 10 de octubre de 2026.
    expired_at: 2026-11-10

  - id: CVE-2026-47892
    statement: >-
      Elusión de un predicado de cabecera en peticiones de verificación previa de
      endpoints funcionales de WebFlux. El gateway no declara RouterFunction; el
      enrutado es de Spring Cloud Gateway. Sin versión 6.2.x corregida publicada
      al 10 de octubre de 2026.
    expired_at: 2026-11-10
