name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  JAVA_VERSION: '21'
  PYTHON_VERSION: '3.12'
  NODE_VERSION: '20'

jobs:

  # ── 1. Ningún secreto entra al repositorio ──────────────────────────────
  secretos:
    name: Escaneo de secretos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # historial completo: Gitleaks revisa commits antiguos
      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ── 2. Detecta qué cambió para no reconstruir todo el monorepo ──────────
  cambios:
    name: Detectar cambios
    runs-on: ubuntu-latest
    outputs:
      java: ${{ steps.filtro.outputs.java }}
      python: ${{ steps.filtro.outputs.python }}
      web: ${{ steps.filtro.outputs.web }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filtro
        with:
          filters: |
            java:
              - 'services/ayni-gateway/**'
              - 'services/ayni-identity-service/**'
              - 'services/ayni-core-banking-service/**'
              - 'services/ayni-notification-service/**'
              - 'contracts/**'
            python:
              - 'services/ayni-kyc-service/**'
              - 'contracts/**'
            web:
              - 'web/**'

  # ── 3. Servicios Java: estilo, arquitectura, pruebas, cobertura ─────────
  java:
    name: Java · calidad y pruebas
    needs: cambios
    if: needs.cambios.outputs.java == 'true'
    runs-on: ubuntu-latest
    env:
      # A nivel de job para poder consultarlo desde el `if` de un paso:
      # el env declarado dentro de un paso no es visible en su propia condición.
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }

      - name: Configurar JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: maven

      - name: Compilar
        run: ./mvnw -B clean compile

      # Ejecuta todas las pruebas del monorepo, incluidas las de arquitectura.
      # ArquitecturaHexagonalTest rompe el build si el dominio importa Spring o JPA.
      - name: Pruebas (unitarias, dominio y arquitectura)
        run: ./mvnw -B verify

      # El umbral del 80 % sobre el dominio se aplica dentro de `verify`, en la
      # ejecucion `umbral-dominio` de JaCoCo declarada en el POM padre. Es
      # bloqueante y no necesita un paso propio aqui. Ver ADR-0006.

      # Se omite mientras SONAR_TOKEN no esté configurado, en lugar de fallar.
      #
      # `sonar:sonar` por si solo SUBE el analisis y termina: no consulta el
      # veredicto de la puerta de calidad. Con qualitygate.wait el paso espera
      # el resultado y lo deja escrito en el log, que es lo que permite saber
      # cuando la puerta esta lista para volverse bloqueante.
      #
      # Sigue con continue-on-error a proposito: hacerla bloqueante hoy haria
      # fallar todos los PR por «Coverage on New Code» antes de que exista una
      # sola prueba, y una puerta siempre en rojo enseña a saltarsela. Se retira
      # el continue-on-error cuando reporte en verde. Ver ADR-0006.
      - name: Análisis SonarCloud
        continue-on-error: true
        if: github.event_name == 'pull_request' && env.SONAR_TOKEN != ''
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >
          ./mvnw -B sonar:sonar
          -Dsonar.projectKey=LOAD-13_ayni-bank
          -Dsonar.organization=load-13
          -Dsonar.host.url=https://sonarcloud.io
          -Dsonar.qualitygate.wait=true
          -Dsonar.qualitygate.timeout=180

      - name: Publicar informe de pruebas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: informes-java
          path: |
            **/target/surefire-reports/
            **/target/site/jacoco/

  # ── 4. Servicio de visión (Python) ──────────────────────────────────────
  python:
    name: Python · calidad y pruebas
    needs: cambios
    if: needs.cambios.outputs.python == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/ayni-kyc-service
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Instalar dependencias
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Linting (Ruff)
        run: ruff check .

      - name: Tipado estricto (mypy)
        run: mypy --strict src/

      - name: Pruebas
        run: pytest -q

      # La validacion del contrato OpenAPI se activa en el Sprint 2, cuando
      # exista contracts/kyc-service.openapi.yaml (AYNI-95).

  # ── 5. Aplicación web ───────────────────────────────────────────────────
  web:
    name: Web · calidad y accesibilidad
    needs: cambios
    if: needs.cambios.outputs.web == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web/ayni-web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: web/ayni-web/package-lock.json

      - run: npm ci
      - name: Linting y formato
        run: npm run lint && npm run format:check
      - name: Verificación de tipos
        run: npm run typecheck
      - name: Pruebas
        run: npm run test -- --coverage
      - name: Construir
        run: npm run build
      - name: Accesibilidad (axe-core · WCAG 2.1 AA)
        run: npm run test:a11y

  # ── 6. Imágenes de contenedor ───────────────────────────────────────────
  imagenes:
    name: Construir y escanear imágenes
    needs: [cambios, secretos, java, python, web]
    # Solo cuando hay código de servicio. Mientras services/ esté vacío
    # (Sprint 0, AYNI-38) este job se omite en lugar de fallar.
    if: |
      always() && !failure() && !cancelled() &&
      (needs.cambios.outputs.java == 'true' || needs.cambios.outputs.python == 'true' ||
       needs.cambios.outputs.web == 'true')
    runs-on: ubuntu-latest
    strategy:
      # fail-fast: false porque con el valor por omision, el primer servicio que
      # falla cancela los otros cuatro y se pierde su resultado. Eso convirtio el
      # andamiaje del Sprint 0 en ocho rondas de una correccion cada una, cuando
      # podian haber sido dos o tres viendo todos los fallos juntos.
      fail-fast: false
      # max-parallel porque los cinco jobs descargan el arbol de dependencias a
      # la vez desde la misma IP y Maven Central responde 429. Escalonarlos es
      # mas lento por ronda y mucho mas rapido en total: no hay que repetirla.
      max-parallel: 2
      # `dockerfile` explicito y no derivado del nombre: ayni-web no vive bajo
      # services/, y componer la ruta con una plantilla dejaria fuera la unica
      # imagen que no sigue el patron. Es exactamente lo que paso al anadirla.
      matrix:
        include:
          - servicio: ayni-gateway
            dockerfile: services/ayni-gateway/Dockerfile
          - servicio: ayni-identity-service
            dockerfile: services/ayni-identity-service/Dockerfile
          - servicio: ayni-core-banking-service
            dockerfile: services/ayni-core-banking-service/Dockerfile
          - servicio: ayni-notification-service
            dockerfile: services/ayni-notification-service/Dockerfile
          - servicio: ayni-kyc-service
            dockerfile: services/ayni-kyc-service/Dockerfile
          - servicio: ayni-web
            dockerfile: web/ayni-web/Dockerfile
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Construir imagen (sin publicar)
        uses: docker/build-push-action@v6
        with:
          # El Dockerfile necesita la raiz como contexto: referencia el pom.xml padre
          context: .
          file: ${{ matrix.dockerfile }}
          push: false
          load: true
          tags: ayni/${{ matrix.servicio }}:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Escanear vulnerabilidades (Trivy)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ayni/${{ matrix.servicio }}:ci
          severity: CRITICAL,HIGH
          exit-code: '1'
          ignore-unfixed: true
          # Solo vulnerabilidades. El escaner de secretos recorre cada capa
          # buscando credenciales, que ya cubre Gitleaks sobre el repositorio, y
          # multiplica por tres el tiempo de cada job de esta matriz.
          scanners: vuln

  # ── 7. Puerta única que las reglas de rama exigen ───────────────────────
  ci-ok:
    name: CI completa
    needs: [secretos, java, python, web, imagenes]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Verificar que ningún job falló
        run: |
          if echo '${{ toJSON(needs) }}' | grep -q '"result": *"failure"'; then
            echo "::error::Al menos un job de CI falló. El PR no puede fusionarse."
            exit 1
          fi
          echo "Todas las verificaciones pasaron."
