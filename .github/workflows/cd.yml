name: CD

# Cada merge a `main` llega solo a produccion, sin intervencion humana, pero
# solo despues de volver a pasar la integracion continua completa sobre el
# commit exacto que se va a desplegar. Ver ADR-0026.
#
#   push a main ─▶ CI completa ─▶ imagenes a ECR ─▶ despliegue por SSM
#               ─▶ pruebas de humo contra la URL publica ─▶ tag + Release
#                                       └─ si fallan ─▶ reversion automatica
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      etiqueta:
        description: "Volver a desplegar una etiqueta ya publicada (sha corto). Vacio = el commit actual."
        required: false
        default: ""

permissions:
  contents: write        # crear el tag y la Release de la version
  id-token: write        # credenciales temporales de AWS por OIDC
  pull-requests: write   # lo exige el CI reutilizado
  packages: read

# Un despliegue cada vez. Uno nuevo espera a que termine el anterior en vez de
# cancelarlo: cortar un despliegue a medias es peor que esperar dos minutos.
concurrency:
  group: produccion
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1

jobs:

  # ── 1. La misma integracion continua que en los Pull Requests ───────────
  ci:
    name: Integración continua
    if: github.event.inputs.etiqueta == ''
    uses: ./.github/workflows/ci.yml
    secrets: inherit

  # ── 2. Version que se despliega ─────────────────────────────────────────
  version:
    name: Calcular versión
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      etiqueta: ${{ steps.v.outputs.etiqueta }}
      nueva: ${{ steps.v.outputs.nueva }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - id: v
        run: |
          VERSION=$(tr -d '[:space:]' < VERSION)
          ETIQUETA="${{ github.event.inputs.etiqueta }}"
          [[ -z "$ETIQUETA" ]] && ETIQUETA=$(git rev-parse --short=8 HEAD)
          if git rev-parse -q --verify "refs/tags/v${VERSION}" >/dev/null; then NUEVA=false; else NUEVA=true; fi
          echo "version=$VERSION"   >> "$GITHUB_OUTPUT"
          echo "etiqueta=$ETIQUETA" >> "$GITHUB_OUTPUT"
          echo "nueva=$NUEVA"       >> "$GITHUB_OUTPUT"
          echo "### Versión ${VERSION} · imagen \`${ETIQUETA}\`" >> "$GITHUB_STEP_SUMMARY"

  # ── 3. Publicar imagenes en ECR ─────────────────────────────────────────
  publicar:
    name: Publicar imagen
    needs: [ci, version]
    if: github.event.inputs.etiqueta == ''
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      max-parallel: 3
      matrix:
        include:
          - { servicio: ayni-gateway, dockerfile: services/ayni-gateway/Dockerfile }
          - { servicio: ayni-identity-service, dockerfile: services/ayni-identity-service/Dockerfile }
          - { servicio: ayni-core-banking-service, dockerfile: services/ayni-core-banking-service/Dockerfile }
          - { servicio: ayni-notification-service, dockerfile: services/ayni-notification-service/Dockerfile }
          - { servicio: ayni-kyc-service, dockerfile: services/ayni-kyc-service/Dockerfile }
          - { servicio: ayni-web, dockerfile: web/ayni-web/Dockerfile }
    steps:
      - uses: actions/checkout@v4

      - name: Credenciales temporales de AWS (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROL_DESPLIEGUE }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Iniciar sesión en ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - uses: docker/setup-buildx-action@v3

      # Misma cache que el CI: la imagen ya se construyo y escaneo con Trivy en
      # el job anterior, asi que aqui casi todo sale de cache.
      - name: Construir y publicar
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: true
          provenance: false
          build-args: |
            NEXT_PUBLIC_API_URL=
            NEXT_PUBLIC_APP_VERSION=${{ needs.version.outputs.version }}
          tags: |
            ${{ steps.ecr.outputs.registry }}/ayni/${{ matrix.servicio }}:${{ needs.version.outputs.etiqueta }}
            ${{ steps.ecr.outputs.registry }}/ayni/${{ matrix.servicio }}:v${{ needs.version.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── 4. Desplegar en produccion ──────────────────────────────────────────
  desplegar:
    name: Desplegar en AWS
    needs: [version, publicar]
    if: always() && !failure() && !cancelled()
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ vars.AYNI_URL }}
    steps:
      - name: Credenciales temporales de AWS (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROL_DESPLIEGUE }}
          aws-region: ${{ env.AWS_REGION }}

      # La instancia se apaga de 01:00 a 07:00. Si un merge llega a esa hora,
      # se enciende en lugar de fallar.
      - name: Asegurar que la instancia está encendida
        run: |
          ID=${{ vars.AWS_INSTANCIA }}
          ESTADO=$(aws ec2 describe-instances --instance-ids $ID --query 'Reservations[0].Instances[0].State.Name' --output text)
          if [[ "$ESTADO" != "running" ]]; then
            echo "Instancia en estado $ESTADO: encendiendo"
            aws ec2 start-instances --instance-ids $ID >/dev/null
            aws ec2 wait instance-status-ok --instance-ids $ID
            sleep 60
          fi

      - name: Ejecutar el despliegue en la instancia (SSM)
        run: |
          COMANDO=$(aws ssm send-command \
            --instance-ids ${{ vars.AWS_INSTANCIA }} \
            --document-name AWS-RunShellScript \
            --comment "Ayni ${{ needs.version.outputs.version }} (${{ needs.version.outputs.etiqueta }})" \
            --timeout-seconds 900 \
            --parameters 'commands=[
              "set -e",
              "curl -fsSL https://raw.githubusercontent.com/${{ github.repository }}/${{ github.sha }}/infra/scripts/desplegar.sh -o /opt/ayni/desplegar.sh",
              "chmod +x /opt/ayni/desplegar.sh",
              "AYNI_COMMIT=${{ github.sha }} /opt/ayni/desplegar.sh ${{ needs.version.outputs.etiqueta }} ${{ needs.version.outputs.version }}"
            ]' \
            --query Command.CommandId --output text)
          echo "Comando SSM: $COMANDO"
          for i in $(seq 1 90); do
            sleep 10
            ESTADO=$(aws ssm get-command-invocation --command-id "$COMANDO" --instance-id ${{ vars.AWS_INSTANCIA }} --query Status --output text 2>/dev/null || echo Pending)
            [[ "$ESTADO" =~ ^(Success|Failed|Cancelled|TimedOut)$ ]] && break
          done
          aws ssm get-command-invocation --command-id "$COMANDO" --instance-id ${{ vars.AWS_INSTANCIA }} \
            --query StandardOutputContent --output text
          echo "Estado final: $ESTADO"
          [[ "$ESTADO" == "Success" ]]

  # ── 5. Pruebas de humo contra la URL publica ────────────────────────────
  humo:
    name: Pruebas de humo en producción
    needs: [version, desplegar]
    if: always() && needs.desplegar.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verificar el sistema desplegado
        run: ./infra/scripts/pruebas-humo.sh "${{ vars.AYNI_URL }}" "${{ needs.version.outputs.version }}"

  # ── 6. Reversion automatica si el humo falla ────────────────────────────
  revertir:
    name: Revertir a la versión anterior
    needs: [humo]
    if: always() && needs.humo.result == 'failure'
    runs-on: ubuntu-latest
    steps:
      - name: Credenciales temporales de AWS (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROL_DESPLIEGUE }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Volver a la configuracion anterior
        run: |
          COMANDO=$(aws ssm send-command --instance-ids ${{ vars.AWS_INSTANCIA }} \
            --document-name AWS-RunShellScript --comment "Ayni: reversion automatica" \
            --parameters 'commands=["cd /opt/ayni","for f in .env docker-compose.prod.yml Caddyfile; do [ -f $f.anterior ] && mv $f.anterior $f; done","docker compose --env-file .env -f docker-compose.prod.yml up -d --remove-orphans","grep ^ETIQUETA= .env | cut -d= -f2 > version-actual"]' \
            --query Command.CommandId --output text)
          aws ssm wait command-executed --command-id "$COMANDO" --instance-id ${{ vars.AWS_INSTANCIA }} || true
          echo "::error::Las pruebas de humo fallaron: producción vuelve a la versión anterior."
          exit 1

  # ── 7. Etiquetar la version publicada ───────────────────────────────────
  release:
    name: Publicar Release
    needs: [version, humo]
    if: always() && needs.humo.result == 'success' && needs.version.outputs.nueva == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Crear tag y Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "v${{ needs.version.outputs.version }}" \
            --target "${{ github.sha }}" \
            --title "Ayni Bank v${{ needs.version.outputs.version }}" \
            --generate-notes \
            --notes "Desplegada en producción: ${{ vars.AYNI_URL }} · imagen \`${{ needs.version.outputs.etiqueta }}\`"
