openapi: 3.0.3

# Contrato del ayni-identity-service.
#
# Este fichero es la fuente de verdad de la API, no su documentacion. Vive en
# `contracts/` porque lo consumen tanto la aplicacion web como los servicios que
# hablan con identity, y porque un cambio aqui debe pasar por revision de Pull
# Request igual que un cambio de codigo.
#
# Crece historia a historia. Hoy cubre HU-01 (registro), HU-02 (subida,
# evaluacion, lectura y confirmacion del DNI, ADR-0028) y HU-04 (ingreso con
# segundo factor).

info:
  title: Ayni Identity Service
  version: 0.1.0
  description: |
    Registro, autenticacion y orquestacion del onboarding de Ayni Bank.

    **Todas las respuestas de error usan `application/problem+json`**, segun
    RFC 7807. Un cuerpo de error con forma propia obliga a cada cliente a
    aprender un formato distinto por servicio.
  license:
    name: Propietario

servers:
  - url: http://localhost:8080/api/v1
    description: Desarrollo local, a traves del gateway
  - url: https://staging.ayni.pe/api/v1
    description: Staging

tags:
  - name: onboarding
    description: Alta de nuevos clientes
  - name: Sesion
    description: Ingreso, segundo factor y renovacion de la sesion
  - name: Recuperacion
    description: Recuperacion de la contrasena por correo (HU-21)
  - name: Confirmacion
    description: Confirmacion de operaciones con el segundo factor (HU-07)

paths:
  /registro:
    post:
      tags: [onboarding]
      operationId: registrarVisitante
      summary: Registra un visitante e inicia su solicitud de onboarding
      description: |
        Crea un usuario en estado `PENDIENTE_VERIFICACION` y abre su solicitud
        de onboarding.

        **La respuesta es deliberadamente indistinguible cuando el correo ya
        esta registrado.** Devolver 409, o un mensaje distinto, convertiria este
        endpoint en un oraculo para averiguar que correos tienen cuenta en Ayni:
        basta recorrer una lista filtrada de otro sitio para saber quien es
        cliente del banco. Por eso, ante un correo ya existente, el servicio no
        crea nada, devuelve un `solicitudId` que no corresponde a ninguna
        solicitud real y notifica por correo al titular legitimo de que alguien
        intento registrarse con su direccion.

        Los errores de formato (400) si son explicitos: indicar que el celular
        debe empezar en 9 no revela nada sobre quien es cliente.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SolicitudRegistro"
      responses:
        "202":
          description: |
            Solicitud aceptada. Se devuelve 202 y no 201 porque el alta no
            termina aqui: el usuario existe pero no puede operar hasta superar
            la verificacion de identidad.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RespuestaRegistro"
        "400":
          description: El cuerpo no cumple las validaciones de formato
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemaValidacion"
        "429":
          description: |
            Demasiadas solicitudes desde el mismo origen. El limite lo aplica el
            gateway y es lo que impide recorrer el endpoint en masa pese a que
            las respuestas sean indistinguibles.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problema"

  /solicitudes/{solicitudId}/documentos/url-de-subida:
    post:
      tags: [onboarding]
      operationId: generarUrlDeSubidaDeDocumento
      summary: Firma un formulario para subir un documento KYC directamente a MinIO
      description: |
        El navegador sube el archivo con un POST multipart directo a `url`,
        enviando primero todos los `campos` tal cual y el archivo al final (campo
        `file`); la imagen nunca atraviesa este servicio (diseno-base.md §3.4-3.5,
        §4.1).

        Es una politica POST, no una URL PUT: fija la clave, el tipo de contenido
        y un tamano maximo de 5 MB, y MinIO rechaza la subida que no los cumpla.
        Vale durante 5 minutos. Despues, el navegador devuelve `claveDeObjeto`
        a `POST /solicitudes/{solicitudId}/documentos` para que se evalue.
      parameters:
        - $ref: "#/components/parameters/SolicitudId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SolicitudUrlDeSubida"
      responses:
        "200":
          description: Formulario de subida firmado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UrlDeSubida"
        "400":
          description: El cuerpo no cumple las validaciones de formato
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemaValidacion"
        "404":
          description: La solicitud no existe, o es un senuelo sin titular
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problema"

  /solicitudes/{solicitudId}/documentos:
    post:
      tags: [onboarding]
      operationId: evaluarCapturaDeDni
      summary: Evalua la foto de un lado del DNI recien subida
      description: |
        HU-02, escenarios 1 a 5. Todos los resultados de negocio responden 200
        con un `estado`; no son errores, son pasos del flujo:

        - `ACEPTADO`: la foto es un DNI con calidad suficiente. Queda registrada
          con su SHA-256, tipo MIME y tamano.
        - `RECHAZADO`: con el `motivo` concreto y los `intentosRestantes` de ese
          lado. La foto se borra del almacen.
        - `EN_REVISION_MANUAL`: se agotaron los 3 intentos de ese lado.
        - `VERIFICACION_DIFERIDA`: kyc-service no respondio; la solicitud queda
          en revision y el solicitante no ve un error tecnico.
      parameters:
        - $ref: "#/components/parameters/SolicitudId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SolicitudDeEvaluacion"
      responses:
        "200":
          description: Resultado de la evaluacion
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResultadoDeCaptura"
        "400":
          description: |
            Cuerpo invalido, o la clave no es una foto subida de ese lado para
            esta solicitud (no existe, es de otra solicitud o supera 5 MB).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problema"
        "404":
          description: La solicitud no existe, o es un senuelo sin titular
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problema"

  /solicitudes/{solicitudId}/documentos/extraccion:
    post:
      tags: [onboarding]
      operationId: extraerDatosDelDni
      summary: Lee por OCR los datos del DNI de las dos fotos aceptadas
      description: |
        Antes de leer comprueba que las fotos no cambiaron desde que se
        evaluaron (SHA-256); si cambiaron, `EN_REVISION_MANUAL`. Si el OCR no
        encuentra los datos, `RECHAZADO` con los intentos que quedan del reverso.

        El numero va enmascarado: el titular lo reescribe entero solo si esta mal.
      parameters:
        - $ref: "#/components/parameters/SolicitudId"
      responses:
        "200":
          description: Datos leidos, o el estado del paso
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResultadoDeExtraccion"
        "404":
          description: La solicitud no existe, o es un senuelo sin titular
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problema"
        "409":
          description: Falta la foto aceptada de alguno de los dos lados
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problema"

  /solicitudes/{solicitudId}/identidad/confirmacion:
    post:
      tags: [onboarding]
      operationId: confirmarDatosDelDni
      summary: El titular confirma o corrige los datos leidos del DNI
      description: |
        Lo confirmado se contrasta con lo declarado en el registro (ADR-0009).
        Si coincide, `ACEPTADO` y la solicitud pasa a `DOCUMENTO_CARGADO`. Si no,
        o si se cambia el numero o la fecha de nacimiento de una lectura del MRZ
        con digitos verificadores validos, `EN_REVISION_MANUAL`.
      parameters:
        - $ref: "#/components/parameters/SolicitudId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SolicitudDeConfirmacion"
      responses:
        "200":
          description: Estado del paso
          content:
            application/json:
              schema:
                type: object
                required: [estado]
                properties:
                  estado:
                    type: string
                    enum: [ACEPTADO, EN_REVISION_MANUAL]
        "400":
          description: Los datos no son validos
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemaValidacion"
        "404":
          description: La solicitud no existe, o es un senuelo sin titular
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problema"
        "409":
          description: Todavia no hay una lectura del DNI que confirmar
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problema"

  /sesion:
    post:
      summary: Paso 1 del ingreso · credenciales
      description: |
        Valida correo y contrasena y devuelve un desafio de segundo factor. **No
        emite ningun token todavia**: el ingreso no termina hasta el paso 2.

        La respuesta es identica cuando el correo no existe y cuando la
        contrasena es incorrecta, y ademas ambas tardan lo mismo, porque el
        servicio deriva la contrasena tambien en el primer caso. Distinguirlas
        —por el cuerpo o por el cronometro— convertiria este endpoint en un
        comprobador de cuentas. Es el mismo criterio de ADR-0008.
      operationId: presentarCredenciales
      tags: [Sesion]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Credenciales"
      responses:
        "200":
          description: Credenciales correctas. Falta el segundo factor.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DesafioDeSegundoFactor"
        "400":
          description: El cuerpo no cumple las validaciones de formato
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemaValidacion"
        "401":
          description: |
            Correo desconocido o contrasena incorrecta. El cuerpo es el mismo en
            los dos casos.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problema"
        "403":
          description: La cuenta esta inhabilitada por decision de seguridad
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problema"
        "423":
          description: |
            Ingreso pausado tras cinco intentos fallidos. El cuerpo incluye la
            extension `esperaSegundos`, que es lo que la pantalla usa para pintar
            la cuenta atras.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemaDeBloqueo"

  /sesion/segundo-factor:
    post:
      summary: Paso 2 del ingreso · codigo TOTP
      description: |
        Canjea el desafio por una sesion. El token de acceso viaja en el cuerpo;
        el de renovacion, **solo en una cookie `HttpOnly`** que JavaScript no
        puede leer. Ese reparto es deliberado: lo de vida larga donde un XSS no
        alcanza, lo de vida corta donde el cliente lo necesita para la cabecera
        `Authorization`.

        Un desafio se canjea una sola vez y caduca a los dos minutos.
      operationId: verificarSegundoFactor
      tags: [Sesion]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SolicitudDeSegundoFactor"
      responses:
        "200":
          description: Ingreso completado
          headers:
            Set-Cookie:
              description: |
                Token de renovacion. `HttpOnly`, `Secure`, `SameSite=Strict` y
                `Path=/`, con vigencia de siete dias.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Sesion"
        "401":
          description: El desafio no existe, caduco, o el codigo no es valido
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problema"
        "423":
          description: Ingreso pausado por intentos fallidos
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemaDeBloqueo"

  /sesion/renovacion:
    post:
      summary: Renueva la sesion rotando el token
      description: |
        Consume el token de la cookie y emite otro de la misma familia. La
        caducidad **se hereda, no se reinicia**: una sesion renovada cada seis
        dias tiene que morir igualmente a los siete.

        Presentar un token ya consumido no puede ocurrir en un uso normal —cada
        uno se usa exactamente una vez—, asi que se interpreta como que existe
        una copia: se invalida la familia entera, se avisa al titular por correo
        y ambas partes tienen que autenticarse de nuevo. Escenario 4 de HU-04.
      operationId: renovarSesion
      tags: [Sesion]
      responses:
        "200":
          description: Sesion renovada
          headers:
            Set-Cookie:
              description: El token rotado, con la caducidad heredada.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Sesion"
        "401":
          description: |
            La cookie falta, caduco, o se detecto la reutilizacion de un token.
            Los tres devuelven lo mismo: el cliente hace lo mismo en los tres
            casos, y detallar la reutilizacion solo informaria a quien la
            provoco. Al titular si se le avisa, por correo.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problema"

  /recuperacion:
    post:
      summary: Pide un enlace para recuperar la contrasena (HU-21)
      description: |
        Responde **siempre 202 con el mismo cuerpo**, exista o no la cuenta, y
        nunca antes de una duracion minima (400 ms en produccion): el
        cronometro no puede delatar lo que el cuerpo oculta. Ver ADR-0008 y
        ADR-0030. Como maximo se envian tres enlaces por cuenta y hora; los
        de mas se ignoran en silencio.
      operationId: solicitarRecuperacion
      tags: [Recuperacion]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [correo]
              properties:
                correo:
                  type: string
                  maxLength: 254
                  example: ana.quispe@example.pe
      responses:
        "202":
          description: Identica para todos los correos bien formados
          content:
            application/json:
              schema:
                type: object
                properties:
                  mensaje:
                    type: string
                    example: Si el correo corresponde a una cuenta de Ayni, te enviamos un enlace para cambiar tu contrasena.
        "400":
          description: El correo falta o no tiene formato de correo
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemaValidacion"

  /recuperacion/validacion:
    post:
      summary: Comprueba si un enlace de recuperacion sigue sirviendo
      description: |
        El token viaja en el cuerpo y no en la URL. En la web llega en el
        fragmento del enlace (`#t=`), que el navegador no envia al servidor.
      operationId: validarEnlaceDeRecuperacion
      tags: [Recuperacion]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EnlaceDeRecuperacion"
      responses:
        "204":
          description: El enlace sirve
        "410":
          description: |
            El enlace no existe, caduco (30 minutos), ya se uso o lo anulo uno
            posterior. Los cuatro casos responden igual.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problema"

  /recuperacion/confirmacion:
    post:
      summary: Fija la contrasena nueva con un enlace de recuperacion
      description: |
        Gasta el enlace, invalida todas las sesiones del titular, limpia el
        contador de intentos fallidos, lo anota en la pista de auditoria y
        avisa al titular por correo. El segundo factor sigue siendo
        obligatorio para ingresar: recuperar la contrasena no es recuperar la
        cuenta. Un token de acceso ya emitido vive como mucho 15 minutos mas
        (ADR-0030).
      operationId: restablecerContrasena
      tags: [Recuperacion]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: "#/components/schemas/EnlaceDeRecuperacion"
                - type: object
                  required: [contrasenaNueva]
                  properties:
                    contrasenaNueva:
                      type: string
                      format: password
                      description: Misma politica que el registro.
      responses:
        "204":
          description: Contrasena cambiada
        "400":
          description: La contrasena nueva incumple la politica; el enlace sigue sirviendo
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemaValidacion"
        "410":
          description: El enlace no sirve
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problema"

  /confirmaciones:
    post:
      summary: Abre la confirmacion de una transferencia con el segundo factor (HU-07)
      description: |
        Ruta protegida: la identidad sale de `X-Ayni-Usuario`. identity guarda solo
        la huella de la operacion (forma canonica en ADR-0031). Si el titular eligio
        el correo, le envia un codigo de 6 digitos.
      operationId: iniciarConfirmacion
      tags: [Confirmacion]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [destino, importe, moneda, claveIdempotencia]
              properties:
                destino: { type: string, maxLength: 32, example: "001-1100000-0-031" }
                importe: { type: string, pattern: '^\d{1,7}(\.\d{1,2})?$', example: "150.00" }
                moneda: { type: string, pattern: '^[A-Z]{3}$', example: PEN }
                claveIdempotencia: { type: string, format: uuid }
      responses:
        "201":
          description: Confirmacion abierta
          content:
            application/json:
              schema:
                type: object
                properties:
                  confirmacionId: { type: string, format: uuid }
                  metodo: { $ref: "#/components/schemas/TipoDeSegundoFactor" }
                  expiraEn: { type: string, format: date-time }
        "401": { description: Sin sesion }
        "409": { description: El titular no tiene segundo factor activo }
        "423": { description: Operaciones pausadas por intentos fallidos }

  /confirmaciones/{confirmacionId}/verificacion:
    post:
      summary: Verifica el codigo y emite el token de confirmacion para core-banking
      description: |
        Tres intentos por confirmacion; los fallos cuentan para la misma pausa que el
        ingreso. El token dura 5 minutos y solo sirve para la operacion confirmada: se
        envia a `POST /api/v1/transferencias` en la cabecera `X-Ayni-Confirmacion`.
      operationId: verificarConfirmacion
      tags: [Confirmacion]
      parameters:
        - { name: confirmacionId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [codigo]
              properties:
                codigo: { type: string, example: "123456" }
      responses:
        "200":
          description: Codigo correcto
          content:
            application/json:
              schema:
                type: object
                properties:
                  token: { type: string }
                  expiraEn: { type: string, format: date-time }
        "410": { description: La confirmacion no existe, caduco, se uso o agoto sus intentos }
        "422": { description: Codigo incorrecto; incluye intentosRestantes }
        "423": { description: Operaciones pausadas por intentos fallidos }

  /usuarios/{usuarioId}/segundo-factor/metodo:
    post:
      summary: Eleccion y alta del metodo de segundo factor
      description: Registra la preferencia de metodo 2FA (APP_AUTENTICADORA, CORREO_ELECTRONICO, SMS) para el usuario.
      operationId: seleccionarMetodoSegundoFactor
      tags: [Sesion]
      parameters:
        - name: usuarioId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SolicitudSeleccionMetodo"
      responses:
        "200":
          description: Metodo de segundo factor configurado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MetodoSegundoFactor"
        "400":
          description: Error de validacion en la solicitud
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemaValidacion"

  /segundo-factor/desafio/usuario/{usuarioId}/generar:
    post:
      summary: Genera un desafio OTP por codigo
      description: Genera un nuevo codigo OTP de 6 digitos con hash SHA-256 y 10 min de vigencia.
      operationId: generarDesafioCodigo
      tags: [Sesion]
      parameters:
        - name: usuarioId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SolicitudGenerarDesafio"
      responses:
        "200":
          description: Desafio generado exitosamente
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DesafioCodigo"

  /segundo-factor/desafio/{desafioId}/verificar:
    post:
      summary: Verifica un codigo OTP ingresado
      description: Comprueba el codigo de 6 digitos con limite de 3 intentos fallidos.
      operationId: verificarDesafioCodigo
      tags: [Sesion]
      parameters:
        - name: desafioId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SolicitudVerificarDesafio"
      responses:
        "200":
          description: Codigo verificado correctamente
        "400":
          description: Codigo invalido, expirado o limite de intentos excedido
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problema"

  /registro/{usuarioId}/codigo/reenviar:
    post:
      summary: Reenvia el codigo de verificacion de contacto en el registro
      description: Reenvia un codigo OTP de 6 digitos al contacto inicial durante el alta de usuario.
      operationId: reenviarCodigoRegistro
      tags: [onboarding]
      parameters:
        - name: usuarioId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SolicitudReenvioCodigo"
      responses:
        "200":
          description: Codigo reenviado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DesafioCodigo"

  /registro/{usuarioId}/codigo/verificar:
    post:
      summary: Verifica el codigo de contacto primario en el registro
      description: Confirma la verificacion del correo o celular del usuario en el registro.
      operationId: verificarCodigoRegistro
      tags: [onboarding]
      parameters:
        - name: usuarioId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SolicitudVerificarCodigoRegistro"
      responses:
        "200":
          description: Contacto verificado correctamente
        "400":
          description: Codigo invalido o expirado
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problema"

components:
  parameters:
    SolicitudId:
      name: solicitudId
      in: path
      required: true
      schema:
        type: string
        format: uuid

  schemas:
    SolicitudRegistro:
      type: object
      required:
        [
          nombres,
          apellidos,
          tipoDocumento,
          numeroDocumento,
          fechaNacimiento,
          correo,
          celular,
          contrasena,
          aceptaTerminos,
        ]
      additionalProperties: false
      description: |
        Los datos de identidad se declaran aqui aunque HU-02 vaya a leerlos del
        documento con OCR, y no es una duplicidad: lo declarado es el termino de
        comparacion. Un OCR que lee mal una foto borrosa produce datos plausibles
        pero equivocados, y sin nada contra lo que contrastarlos la identidad
        falsa se crea en silencio. Con las dos lecturas la discrepancia salta y la
        solicitud se deriva a revision manual.
      properties:
        nombres:
          type: string
          maxLength: 80
          description: Tal como los escribe la persona. Se recortan los espacios sobrantes.
          example: Ana Lucia
        apellidos:
          type: string
          maxLength: 120
          description: Los dos apellidos juntos. HU-02 los separa a partir del documento.
          example: Quispe Mendoza
        tipoDocumento:
          type: string
          enum: [DNI, CE, PASAPORTE]
          example: DNI
        numeroDocumento:
          type: string
          maxLength: 20
          description: |
            El formato depende del tipo: ocho digitos para el DNI, de nueve a doce
            caracteres para el carne de extranjeria, de seis a doce para el
            pasaporte. Se guarda cifrado con AES-256-GCM y nunca se devuelve por
            la API ni aparece en un log; para mostrarlo se usan los cuatro
            ultimos digitos.
          example: "45678912"
        fechaNacimiento:
          type: string
          format: date
          description: |
            Debe corresponder a una persona de 18 anos o mas: en el Peru no se
            puede celebrar un contrato bancario a nombre propio antes de esa edad.
          example: "1998-03-14"
        correo:
          type: string
          format: email
          maxLength: 254
          description: Se normaliza a minusculas antes de comprobar unicidad.
          example: ana.quispe@example.pe
        celular:
          type: string
          pattern: "^9[0-9]{8}$"
          description: Nueve digitos que empiezan en 9, formato movil peruano.
          example: "987654321"
        contrasena:
          type: string
          minLength: 12
          maxLength: 128
          format: password
          description: |
            Minimo 12 caracteres con mayuscula, minuscula, digito y simbolo. Se
            almacena con Argon2id; nunca en claro ni con un hash reversible, y
            nunca aparece en un log.
          example: "Cont!rasena2026#"
        aceptaTerminos:
          type: boolean
          description: |
            Debe ser `true`. El consentimiento al tratamiento de datos
            personales exige la Ley N.o 29733 y no puede venir marcado por
            defecto en la interfaz.
      example:
        nombres: Ana Lucia
        apellidos: Quispe Mendoza
        tipoDocumento: DNI
        numeroDocumento: "45678912"
        fechaNacimiento: "1998-03-14"
        correo: ana.quispe@example.pe
        celular: "987654321"
        contrasena: "Cont!rasena2026#"
        aceptaTerminos: true

    SolicitudUrlDeSubida:
      type: object
      required: [tipoDocumento, extension]
      additionalProperties: false
      properties:
        tipoDocumento:
          type: string
          enum: [ANVERSO, REVERSO, SELFIE]
          description: Que cara/imagen del proceso de verificacion se va a subir.
          example: ANVERSO
        extension:
          type: string
          enum: [jpg, jpeg, png, webp]
          description: Sin PDF; kyc-service analiza la imagen con OpenCV, que no lo lee.
          example: jpg
      example:
        tipoDocumento: ANVERSO
        extension: jpg

    UrlDeSubida:
      type: object
      required: [url, campos, claveDeObjeto, expiraEn]
      properties:
        url:
          type: string
          format: uri
          description: Destino del formulario POST (el bucket de documentos KYC).
        campos:
          type: object
          additionalProperties:
            type: string
          description: |
            Campos del formulario, a enviar tal cual antes del archivo: `key`,
            `Content-Type`, `policy` y los de la firma `x-amz-*`.
        claveDeObjeto:
          type: string
          description: Clave con la que quedara guardado; se devuelve al pedir la evaluacion.
        expiraEn:
          type: string
          format: date-time
          description: Momento en que el formulario deja de ser valido (5 minutos despues de emitido).
      example:
        url: https://minio.ayni.pe/ayni-kyc-documentos
        campos:
          key: kyc/6b1f9c2a-.../anverso-....jpg
          Content-Type: image/jpeg
          policy: eyJleHBpcmF0aW9uIjoi...
          x-amz-algorithm: AWS4-HMAC-SHA256
          x-amz-credential: ayni_minio/20260906/us-east-1/s3/aws4_request
          X-Amz-Date: 20260906T100000Z
          x-amz-signature: 526ce79e...
        claveDeObjeto: kyc/6b1f9c2a-.../anverso-....jpg
        expiraEn: "2026-09-06T10:05:00Z"

    SolicitudDeEvaluacion:
      type: object
      required: [tipoDocumento, claveDeObjeto]
      additionalProperties: false
      properties:
        tipoDocumento:
          type: string
          enum: [ANVERSO, REVERSO]
        claveDeObjeto:
          type: string
          maxLength: 255
          description: La `claveDeObjeto` que devolvio url-de-subida.

    ResultadoDeCaptura:
      type: object
      required: [estado]
      properties:
        estado:
          type: string
          enum: [ACEPTADO, RECHAZADO, EN_REVISION_MANUAL, VERIFICACION_DIFERIDA]
        motivo:
          type: string
          enum: [NO_ES_DNI, ENCUADRE, DESENFOQUE, REFLEJO, ILUMINACION, LADO_INCORRECTO]
          description: Solo si `estado` es RECHAZADO.
        intentosRestantes:
          type: integer
          minimum: 0
          maximum: 2
          description: Solo si `estado` es RECHAZADO. Fotos que quedan de ese lado.
      example:
        estado: RECHAZADO
        motivo: DESENFOQUE
        intentosRestantes: 2

    ResultadoDeExtraccion:
      type: object
      required: [estado]
      properties:
        estado:
          type: string
          enum: [ACEPTADO, RECHAZADO, EN_REVISION_MANUAL, VERIFICACION_DIFERIDA]
        datos:
          $ref: "#/components/schemas/DatosLeidosDelDni"
        intentosRestantes:
          type: integer
          minimum: 0
          description: Solo si `estado` es RECHAZADO (el OCR no pudo leer el reverso).

    DatosLeidosDelDni:
      type: object
      required: [numeroEnmascarado, nombres, apellidos, fechaNacimiento, sexo, confiable]
      properties:
        numeroEnmascarado:
          type: string
          example: "****6677"
        nombres:
          type: string
          example: ANA LUCIA
        apellidos:
          type: string
          example: QUISPE MAMANI
        fechaNacimiento:
          type: string
          format: date
        sexo:
          type: string
          enum: [M, F]
        fechaEmision:
          type: string
          format: date
          description: Ausente si el OCR no la encontro; el titular la completa al confirmar.
        confiable:
          type: boolean
          description: Verdadero si vienen del MRZ con sus digitos verificadores validos.

    SolicitudDeConfirmacion:
      type: object
      required: [nombres, apellidos, fechaNacimiento, sexo, fechaEmision]
      additionalProperties: false
      properties:
        numero:
          type: string
          pattern: '^\d{8}$'
          description: Opcional. Vacio o ausente conserva el numero leido.
        nombres:
          type: string
          maxLength: 80
        apellidos:
          type: string
          maxLength: 120
        fechaNacimiento:
          type: string
          format: date
        sexo:
          type: string
          enum: [M, F]
        fechaEmision:
          type: string
          format: date

    EnlaceDeRecuperacion:
      type: object
      required: [token]
      properties:
        token:
          type: string
          maxLength: 128
          description: Token del enlace; 256 bits aleatorios en Base64 URL.

    Credenciales:
      type: object
      required: [correo, contrasena]
      additionalProperties: false
      properties:
        correo:
          type: string
          example: ana.quispe@example.pe
        contrasena:
          type: string
          format: password
          description: |
            No se valida su formato aqui a proposito. Rechazar una contrasena
            corta con un 400 la distinguiria de una bien formada pero incorrecta,
            que devuelve 401, y esa diferencia vuelve a delatar cuentas.
      example:
        correo: ana.quispe@example.pe
        contrasena: "Cont!rasena2026#"

    DesafioDeSegundoFactor:
      type: object
      required: [desafioId, requiereInscripcion]
      properties:
        desafioId:
          type: string
          format: uuid
          description: Vale de dos minutos que canjea el paso 2.
        requiereInscripcion:
          type: boolean
          description: |
            `true` la primera vez que alguien entra: aun no tiene segundo factor
            y hay que darlo de alta antes de continuar.
        uriDeAprovisionamiento:
          type: string
          nullable: true
          description: |
            URI `otpauth://` con el que la pantalla pinta el codigo QR. **Lleva
            el secreto dentro**, asi que solo aparece mientras la inscripcion no
            este confirmada y nunca se registra en un log. Nulo en cuanto el
            segundo factor queda confirmado.
          example: otpauth://totp/Ayni%20Bank%3Aana%40example.pe?secret=GEZDGNBVGY3TQOJQGEZDGNBVGY3TQOJQ&issuer=Ayni%20Bank&algorithm=SHA1&digits=6&period=30

    SolicitudDeSegundoFactor:
      type: object
      required: [desafioId, codigo]
      additionalProperties: false
      properties:
        desafioId:
          type: string
          format: uuid
        codigo:
          type: string
          pattern: "^[0-9]{6}$"
          description: |
            Los seis digitos que muestra la aplicacion de autenticacion. Se
            admite la ventana anterior y la siguiente, de treinta segundos cada
            una: entre leer el codigo y teclearlo pasan segundos, y los relojes
            de los moviles no van sincronizados al milisegundo.
          example: "049713"

    Sesion:
      type: object
      required: [tokenDeAcceso, expiraEn]
      properties:
        tokenDeAcceso:
          type: string
          description: |
            JWT firmado con HS256, valido quince minutos. Lleva el identificador
            del usuario y su estado, nada mas: un JWT va firmado pero no cifrado,
            y cualquiera que lo intercepte lee su contenido.
        expiraEn:
          type: string
          format: date-time
      example:
        # Sin un JWT de ejemplo, ni siquiera troceado: el escaneo de secretos mide
        # entropia, y una cadena Base64 con esa pinta la marca como credencial
        # filtrada. Un ejemplo no vale una alerta que hay que aprender a ignorar.
        tokenDeAcceso: <JWT firmado con HS256>
        expiraEn: "2026-08-30T10:30:30Z"

    ProblemaDeBloqueo:
      allOf:
        - $ref: "#/components/schemas/Problema"
        - type: object
          properties:
            esperaSegundos:
              type: integer
              description: |
                Lo que falta para poder reintentar. Decirlo no debilita nada:
                quien esta bloqueado ya lo sabe, y ocultarlo solo consigue que
                reintente a ciegas.
              example: 277

    RespuestaRegistro:
      type: object
      required: [solicitudId, estado, mensaje]
      properties:
        solicitudId:
          type: string
          format: uuid
          description: |
            Identificador de la solicitud de onboarding, con el que continua el
            flujo de verificacion de identidad. Opaco a proposito: no se deriva
            del correo ni del identificador del usuario.
          example: 6b1f9c2a-0d3e-4a7b-8c11-5f2e9a4d7c31
        estado:
          type: string
          enum: [PENDIENTE_VERIFICACION]
          description: |
            Unico valor posible en esta respuesta. Se devuelve igualmente
            cuando el correo ya existia, porque cualquier variacion delataria
            la existencia de la cuenta.
        mensaje:
          type: string
          description: |
            Texto neutro que la interfaz muestra tal cual. La redaccion aprobada
            en el prototipo es la que no afirma ni niega que el correo exista.
          example: Si el correo esta disponible, te enviaremos un enlace de verificacion.

    Problema:
      type: object
      description: Error segun RFC 7807.
      required: [type, title, status]
      properties:
        type:
          type: string
          format: uri
          example: https://ayni.pe/problemas/limite-de-peticiones
        title:
          type: string
          example: Demasiadas solicitudes
        status:
          type: integer
          example: 429
        detail:
          type: string
          description: |
            Explicacion orientada a la persona. Nunca incluye datos de otro
            usuario, ni rastros internos, ni nada que permita deducir si un
            correo esta registrado.
        instance:
          type: string
          format: uri
          example: /api/v1/registro

    ProblemaValidacion:
      allOf:
        - $ref: "#/components/schemas/Problema"
        - type: object
          properties:
            errores:
              type: array
              description: Un elemento por campo que incumple su validacion.
              items:
                type: object
                required: [campo, mensaje]
                properties:
                  campo:
                    type: string
                    example: celular
                  mensaje:
                    type: string
                    example: El celular debe tener nueve digitos y empezar en 9.
          example:
            type: https://ayni.pe/problemas/validacion
            title: Los datos enviados no son validos
            status: 400
            instance: /api/v1/registro
            errores:
              - campo: contrasena
                mensaje: La contrasena debe tener al menos 12 caracteres.
              - campo: aceptaTerminos
                mensaje: Debes aceptar los terminos y la politica de datos personales.

    TipoDeSegundoFactor:
      type: string
      enum: [APP_AUTENTICADORA, CORREO_ELECTRONICO, SMS]

    SolicitudSeleccionMetodo:
      type: object
      required: [tipo]
      properties:
        tipo:
          $ref: "#/components/schemas/TipoDeSegundoFactor"

    MetodoSegundoFactor:
      type: object
      required: [id, usuarioId, tipo, confirmado]
      properties:
        id:
          type: string
          format: uuid
        usuarioId:
          type: string
          format: uuid
        tipo:
          $ref: "#/components/schemas/TipoDeSegundoFactor"
        secreto:
          type: string
          nullable: true
        confirmado:
          type: boolean

    SolicitudGenerarDesafio:
      type: object
      required: [tipoFactor]
      properties:
        tipoFactor:
          $ref: "#/components/schemas/TipoDeSegundoFactor"

    SolicitudVerificarDesafio:
      type: object
      required: [codigo]
      properties:
        codigo:
          type: string
          pattern: "^[0-9]{6}$"

    DesafioCodigo:
      type: object
      required: [id, usuarioId, tipoFactor, expiraEn, intentosRealizados, verificado]
      properties:
        id:
          type: string
          format: uuid
        usuarioId:
          type: string
          format: uuid
        tipoFactor:
          type: string
        expiraEn:
          type: string
          format: date-time
        intentosRealizados:
          type: integer
        verificado:
          type: boolean

    SolicitudReenvioCodigo:
      type: object
      required: [tipoFactor]
      properties:
        tipoFactor:
          $ref: "#/components/schemas/TipoDeSegundoFactor"

    SolicitudVerificarCodigoRegistro:
      type: object
      required: [tipoFactor, codigo]
      properties:
        tipoFactor:
          $ref: "#/components/schemas/TipoDeSegundoFactor"
        codigo:
          type: string
          pattern: "^[0-9]{6}$"
