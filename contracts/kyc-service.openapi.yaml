openapi: 3.0.3
info:
  title: KYC Service API
  version: 2.0.0
  description: |
    Verificación del DNI peruano (HU-02). Uso interno: solo lo llama
    identity-service, nunca el navegador (diseno-base.md §3.4).

    Las dos operaciones son **síncronas**, con el timeout de 10 s que fija
    diseno-base.md §3.5 punto 5 (ver ADR-0026). Las imágenes no viajan por la
    API: identity envía la clave del objeto y kyc-service lo lee de MinIO.

    La versión 1.0.0 describía un flujo asíncrono (`POST /kyc/verify` con 202 y
    consulta posterior) que nunca llegó a implementarse en Python.
  contact:
    name: LOAD-13 Team
    email: team@ayni-bank.com
  license:
    name: Proprietary
    url: https://ayni-bank.com

servers:
  - url: http://localhost:8000
    description: Desarrollo local (docker compose)
  - url: http://ayni-kyc-service:8000
    description: Red interna de Docker

tags:
  - name: Documentos
    description: Evaluación de cada foto del DNI y extracción de sus datos

paths:
  /kyc/documentos/evaluacion:
    post:
      tags:
        - Documentos
      summary: Evaluar la foto de un lado del DNI
      description: |
        Comprueba que la imagen sea un DNI peruano (proporción ISO/IEC 7810 ID-1)
        y que tenga calidad suficiente: nitidez, sin reflejos, encuadre completo
        e iluminación. Un rechazo no es un error: responde 200 con `aceptada=false`
        y el motivo concreto para que el solicitante repita la foto.
      operationId: evaluarCaptura
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EvaluacionRequest'
            example:
              documentKey: "kyc/0f8fad5b-d9cb-469f-a165-70867728950e/anverso-7c9e6679-7425-40de-944b-e07fc1f90ae7.jpg"
              lado: ANVERSO
      responses:
        '200':
          description: Resultado de la evaluación
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EvaluacionResponse'
              example:
                aceptada: false
                esDni: true
                nitida: false
                sinReflejos: true
                bienEncuadrada: true
                bienIluminada: true
                motivoRechazo: DESENFOQUE
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /kyc/documentos/extraccion:
    post:
      tags:
        - Documentos
      summary: Extraer los datos del DNI
      description: |
        OCR de ambas caras. Primero se lee la zona MRZ del reverso, que trae
        dígitos verificadores; si no valida, se usan heurísticas sobre el
        anverso (`confiable=false`). La fecha de emisión siempre se lee del
        anverso, porque el MRZ no la trae, y puede faltar.

        Si no se encuentran los datos, responde 200 con `legible=false`: no es
        un error del servicio, el solicitante debe repetir las fotos.
      operationId: extraerDatos
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExtraccionRequest'
      responses:
        '200':
          description: Datos extraídos, o `legible=false`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExtraccionResponse'
              example:
                legible: true
                datos:
                  dni: "44556677"
                  nombres: "ANA LUCIA"
                  apellidos: "QUISPE MAMANI"
                  fechaNacimiento: "1990-05-15"
                  sexo: "F"
                  fechaEmision: "2021-08-20"
                  fuente: MRZ
                  confiable: true
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

components:
  schemas:
    ClaveDeDocumento:
      type: string
      description: |
        Clave del objeto en el bucket de documentos KYC, tal como la genera
        identity-service: `kyc/{solicitudId}/{lado}-{uuid}.{extension}`.
      pattern: '^kyc/[0-9a-fA-F-]{36}/(anverso|reverso)-[0-9a-fA-F-]{36}\.(jpg|jpeg|png|webp)$'

    LadoDelDocumento:
      type: string
      enum:
        - ANVERSO
        - REVERSO

    MotivoRechazo:
      type: string
      description: |
        Por qué se rechaza la foto. Si hay varios problemas se informa el que
        conviene corregir primero.
      enum:
        - NO_ES_DNI
        - ENCUADRE
        - DESENFOQUE
        - REFLEJO
        - ILUMINACION

    EvaluacionRequest:
      type: object
      required:
        - documentKey
        - lado
      properties:
        documentKey:
          $ref: '#/components/schemas/ClaveDeDocumento'
        lado:
          $ref: '#/components/schemas/LadoDelDocumento'

    EvaluacionResponse:
      type: object
      required:
        - aceptada
        - esDni
        - nitida
        - sinReflejos
        - bienEncuadrada
        - bienIluminada
      properties:
        aceptada:
          type: boolean
        esDni:
          type: boolean
        nitida:
          type: boolean
        sinReflejos:
          type: boolean
        bienEncuadrada:
          type: boolean
        bienIluminada:
          type: boolean
        motivoRechazo:
          # Nulo (o ausente) cuando la foto se acepta.
          $ref: '#/components/schemas/MotivoRechazo'

    ExtraccionRequest:
      type: object
      required:
        - anversoDocumentKey
        - reversoDocumentKey
      properties:
        anversoDocumentKey:
          $ref: '#/components/schemas/ClaveDeDocumento'
        reversoDocumentKey:
          $ref: '#/components/schemas/ClaveDeDocumento'

    ExtraccionResponse:
      type: object
      required:
        - legible
      properties:
        legible:
          type: boolean
          description: Falso si el OCR no encontró los datos requeridos.
        datos:
          $ref: '#/components/schemas/DatosExtraidos'

    DatosExtraidos:
      type: object
      required:
        - dni
        - nombres
        - apellidos
        - fechaNacimiento
        - sexo
        - fuente
        - confiable
      properties:
        dni:
          type: string
          pattern: '^\d{8}$'
          description: Número de DNI, exactamente 8 dígitos
          example: "44556677"
        nombres:
          type: string
        apellidos:
          type: string
          description: Primer y segundo apellido separados por un espacio
        fechaNacimiento:
          type: string
          format: date
        sexo:
          type: string
          description: M o F; "<" si el MRZ no lo informa
        fechaEmision:
          type: string
          format: date
          nullable: true
          description: Leída del anverso; nula si el OCR no la encontró
        fuente:
          type: string
          enum:
            - MRZ
            - HEURISTICA_ANVERSO
        confiable:
          type: boolean
          description: Verdadero solo si los datos vienen del MRZ con todos sus dígitos verificadores válidos

    ErrorResponse:
      type: object
      required:
        - code
        - message
        - timestamp
      properties:
        code:
          type: string
          example: "BAD_REQUEST"
        message:
          type: string
        timestamp:
          type: string
          format: date-time

  responses:
    BadRequest:
      description: Petición inválida (clave con formato incorrecto, imagen de más de 5 MB)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    NotFound:
      description: La clave no corresponde a ningún objeto del bucket
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    InternalError:
      description: Error interno del servidor
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

security: []
