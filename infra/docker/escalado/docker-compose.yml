# Ayni Bank — réplicas de los servicios sin estado (AYNI-319 y AYNI-306 · HU-16)
#
# Una segunda instancia del gateway, de identity y de kyc, y nginx repartiendo entre cada par.
# Se suma al entorno local; no lo sustituye:
#
#   docker compose --env-file .env -f infra/docker/docker-compose.yml \
#                  -f infra/docker/escalado/docker-compose.yml up -d --wait
#   curl -si http://localhost:8088/actuator/health | grep -i x-ayni-instancia   (alterna)
#
#   cliente ─▶ nginx :8088 ─▶ gateway ×2 ─▶ nginx :8081 ─▶ identity ×2 ─▶ nginx :8000 ─▶ kyc ×2
#                                       └─▶ core-banking ×1
#
# Se replica solo lo que no guarda estado propio. El gateway: la sesion viaja en el token y el
# limite de peticiones vive en Redis (ADR-0035). identity: sesiones, desafios y codigos usados
# viven en PostgreSQL, y no tiene tareas programadas. kyc: cada verificacion es una peticion
# independiente.
#
# core-banking y notification NO se replican: tienen tareas programadas (cierre diario y devengo,
# conciliacion interbancaria, publicacion del outbox, mantenimiento, despacho de avisos) que con
# dos copias correrian dos veces. Replicarlos exige antes un candado distribuido para esas tareas
# (docs/despliegue/replicas-de-servicios.md). La base de datos tampoco se duplica aqui: escala en
# vertical con su replica de alta disponibilidad (ADR-0037).

x-identity-por-el-balanceador: &identity-por-el-balanceador
  AYNI_IDENTITY_URI: http://ayni-balanceador:8081

x-kyc-por-el-balanceador: &kyc-por-el-balanceador
  AYNI_KYC_SERVICE_URL: http://ayni-balanceador:8000

services:
  # La primera instancia de cada servicio tambien pasa por el balanceador.
  ayni-gateway:
    environment: *identity-por-el-balanceador

  ayni-identity-service:
    environment: *kyc-por-el-balanceador

  ayni-gateway-2:
    # Las rutas son relativas a infra/docker: con varios -f, compose las resuelve desde el primero.
    extends: { file: docker-compose.yml, service: ayni-gateway }
    # La misma imagen que la primera instancia: escalar es arrancar otra copia, no construir otra.
    image: ayni-bank-ayni-gateway:latest
    container_name: ayni-gateway-2
    ports: !override ["8081:8080"]
    environment: *identity-por-el-balanceador
    depends_on:
      ayni-identity-service: { condition: service_healthy }
      ayni-core-banking-service: { condition: service_healthy }
      redis: { condition: service_started }

  ayni-identity-service-2:
    extends: { file: docker-compose.yml, service: ayni-identity-service }
    image: ayni-bank-ayni-identity-service:latest
    container_name: ayni-identity-service-2
    ports: !reset []
    environment:
      <<: *kyc-por-el-balanceador
      # Carga unica al arrancar: la hace la primera instancia, nunca la copia.
      AYNI_REPUBLICAR_TITULARES: "false"

  ayni-kyc-service-2:
    extends: { file: docker-compose.yml, service: ayni-kyc-service }
    image: ayni-bank-ayni-kyc-service:latest
    container_name: ayni-kyc-service-2
    ports: !reset []

  ayni-balanceador:
    image: nginx:1.27-alpine
    container_name: ayni-balanceador
    ports: ["8088:80"]
    networks: [ayni]
    volumes:
      - ./escalado/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    # nginx resuelve los nombres de todas las instancias al arrancar: tienen que existir ya.
    depends_on:
      ayni-gateway: { condition: service_healthy }
      ayni-gateway-2: { condition: service_healthy }
      ayni-identity-service: { condition: service_started }
      ayni-identity-service-2: { condition: service_started }
      ayni-kyc-service: { condition: service_started }
      ayni-kyc-service-2: { condition: service_started }
