# Ayni Bank — laboratorio de escalado horizontal (semana 14 · ISO 25010, flexibilidad · AYNI-319)
#
# Una segunda instancia del gateway (8081) y nginx repartiendo entre las dos (8088). Se suma
# al entorno local; no lo sustituye:
#
#   docker compose --env-file .env -f infra/docker/docker-compose.yml \
#                  -f infra/docker/escalado/docker-compose.yml up -d --wait
#   curl -si http://localhost:8088/actuator/health | grep -i x-ayni-instancia   (alterna)
#
# El gateway se puede duplicar porque no guarda estado: la sesion viaja en el token y el
# limite de peticiones vive en Redis (ADR-0035), compartido por las dos instancias. El cuello
# de botella de un banco sigue siendo la base de datos, que no se duplica: por eso el
# escalado horizontal se hace en el borde y la base escala en vertical (RDS) con su replica
# de alta disponibilidad (ADR-0037).

services:
  ayni-gateway-2:
    # Las rutas son relativas a infra/docker: con varios -f, compose las resuelve desde el primero.
    extends: { file: docker-compose.yml, service: ayni-gateway }
    # La misma imagen que la primera instancia: escalar es arrancar otra copia, no construir otra.
    image: ayni-bank-ayni-gateway:latest
    container_name: ayni-gateway-2
    ports: !override ["8081:8080"]
    depends_on:
      ayni-identity-service: { condition: service_healthy }
      ayni-core-banking-service: { condition: service_healthy }
      redis: { condition: service_started }

  ayni-balanceador:
    image: nginx:1.27-alpine
    container_name: ayni-balanceador
    ports: ["8088:80"]
    networks: [ayni]
    volumes:
      - ./escalado/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      ayni-gateway: { condition: service_healthy }
      ayni-gateway-2: { condition: service_healthy }
