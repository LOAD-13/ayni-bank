# Reparte por turnos entre las dos instancias de cada servicio sin estado (AYNI-319, AYNI-306).
# Si una cae, nginx la salta durante 10 s tras un fallo y reintenta la peticion en la otra.
# Memoria compartida (zone) en cada upstream: sin ella cada worker de nginx lleva su propio
# turno y, con conexiones nuevas, todos empiezan por la primera instancia.

upstream gateway {
    zone gateway 64k;
    server ayni-gateway:8080   max_fails=1 fail_timeout=10s;
    server ayni-gateway-2:8080 max_fails=1 fail_timeout=10s;
}

upstream identity {
    zone identity 64k;
    server ayni-identity-service:8081   max_fails=1 fail_timeout=10s;
    server ayni-identity-service-2:8081 max_fails=1 fail_timeout=10s;
}

upstream kyc {
    zone kyc 64k;
    server ayni-kyc-service:8000   max_fails=1 fail_timeout=10s;
    server ayni-kyc-service-2:8000 max_fails=1 fail_timeout=10s;
}

# Entrada publica: hacia los dos gateways.
server {
    listen 80;

    location / {
        proxy_pass http://gateway;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Una instancia caida no responde a la conexion: tras 1 s se prueba la otra.
        proxy_connect_timeout 1s;
        proxy_next_upstream error timeout http_502 http_503;
        # Que instancia atendio: es la evidencia de que el balanceo reparte.
        add_header X-Ayni-Instancia $upstream_addr always;
    }
}

# Interna: el gateway llega a identity por aqui (AYNI_IDENTITY_URI).
server {
    listen 8081;
    # nginx corta en 1 MB por defecto; identity acepta documentos de hasta 5 MB (HU-02).
    client_max_body_size 12m;

    location / {
        proxy_pass http://identity;
        proxy_set_header Host $host;
        # La IP del cliente sigue siendo la que puso el gateway: la usa la auditoria de identity.
        proxy_set_header X-Forwarded-For $http_x_forwarded_for;
        proxy_connect_timeout 1s;
        # Solo se reintenta si la instancia no respondio: un POST que llego a procesarse no se
        # repite en la otra (inicio de sesion, registro).
        proxy_next_upstream error timeout;
        add_header X-Ayni-Instancia-Identity $upstream_addr always;
    }
}

# Interna: identity llega a kyc por aqui (AYNI_KYC_SERVICE_URL).
server {
    listen 8000;
    # El selfie y el documento llegan en la misma peticion, hasta 5 MB cada uno.
    client_max_body_size 12m;

    location / {
        proxy_pass http://kyc;
        proxy_set_header Host $host;
        proxy_connect_timeout 1s;
        # El OCR tarda; el plazo lo pone identity (30 s para la extraccion).
        proxy_read_timeout 35s;
        proxy_next_upstream error timeout;
    }
}
