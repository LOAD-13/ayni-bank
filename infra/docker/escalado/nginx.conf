# Reparte por turnos entre las dos instancias del gateway (AYNI-319). Si una cae, nginx la
# salta durante 10 s tras un fallo y reintenta la peticion en la otra.
upstream gateway {
    # Memoria compartida: sin ella cada worker de nginx lleva su propio turno y, con conexiones
    # nuevas, todos empiezan por la primera instancia.
    zone gateway 64k;
    server ayni-gateway:8080   max_fails=1 fail_timeout=10s;
    server ayni-gateway-2:8080 max_fails=1 fail_timeout=10s;
}

server {
    listen 80;

    location / {
        proxy_pass http://gateway;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Una instancia caída no responde a la conexión: tras 1 s se prueba la otra.
        proxy_connect_timeout 1s;
        proxy_next_upstream error timeout http_502 http_503;
        # Que instancia atendio: es la evidencia de que el balanceo reparte.
        add_header X-Ayni-Instancia $upstream_addr always;
    }
}
