# Ayni Bank — entorno de desarrollo local
# Levantar:  docker compose -f infra/docker/docker-compose.yml up -d
# Detener:   docker compose -f infra/docker/docker-compose.yml down -v

name: ayni-bank

x-java-common: &java-common
  restart: unless-stopped
  networks: [ayni]
  environment: &java-env
    SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
    SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
    SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
    SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
    SPRING_RABBITMQ_HOST: rabbitmq
    SPRING_RABBITMQ_USERNAME: ${RABBITMQ_USER}
    SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
    MINIO_ENDPOINT: http://minio:9000
    MINIO_ACCESS_KEY: ${MINIO_ROOT_USER}
    MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
    AYNI_JWT_SECRET: ${AYNI_JWT_SECRET}
    AYNI_ENCRYPTION_KEY: ${AYNI_ENCRYPTION_KEY}
    JAVA_TOOL_OPTIONS: "-XX:MaxRAMPercentage=70"

services:

  # ─────────────────────────── Infraestructura ───────────────────────────

  postgres:
    image: postgres:16-alpine
    container_name: ayni-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports: ["5432:5432"]
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./init/01-schemas.sql:/docker-entrypoint-initdb.d/01-schemas.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [ayni]

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: ayni-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    ports: ["5672:5672", "15672:15672"]
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 15s
      timeout: 10s
      retries: 10
    networks: [ayni]

  minio:
    image: minio/minio:latest
    container_name: ayni-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports: ["9000:9000", "9001:9001"]
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 15s
      timeout: 10s
      retries: 10
    networks: [ayni]

  # Crea los buckets privados en el primer arranque y sale
  minio-init:
    image: minio/mc:latest
    container_name: ayni-minio-init
    depends_on:
      minio: { condition: service_healthy }
    entrypoint: >
      /bin/sh -c "
      mc alias set ayni http://minio:9000 $${MINIO_ROOT_USER} $${MINIO_ROOT_PASSWORD};
      mc mb --ignore-existing ayni/ayni-kyc-documentos;
      mc mb --ignore-existing ayni/ayni-estados-cuenta;
      mc anonymous set none ayni/ayni-kyc-documentos;
      mc anonymous set none ayni/ayni-estados-cuenta;
      echo 'Buckets privados creados.';
      "
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    networks: [ayni]

  # ─────────────────────────── Servicios Ayni ───────────────────────────

  ayni-gateway:
    <<: *java-common
    build: ../../services/ayni-gateway
    container_name: ayni-gateway
    ports: ["8080:8080"]
    depends_on:
      ayni-identity-service: { condition: service_started }
      ayni-core-banking-service: { condition: service_started }
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/actuator/health"]
      interval: 20s
      timeout: 5s
      retries: 5

  ayni-identity-service:
    <<: *java-common
    build: ../../services/ayni-identity-service
    container_name: ayni-identity-service
    environment:
      <<: *java-env
      AYNI_KYC_SERVICE_URL: http://ayni-kyc-service:8000
    depends_on:
      postgres: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
      minio: { condition: service_healthy }

  ayni-core-banking-service:
    <<: *java-common
    build: ../../services/ayni-core-banking-service
    container_name: ayni-core-banking-service
    environment:
      <<: *java-env
      AYNI_FX_SUNAT_URL: ${AYNI_FX_SUNAT_URL}
    depends_on:
      postgres: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }

  ayni-notification-service:
    <<: *java-common
    build: ../../services/ayni-notification-service
    container_name: ayni-notification-service
    environment:
      <<: *java-env
      AYNI_SMTP_HOST: ${AYNI_SMTP_HOST}
      AYNI_SMTP_PORT: ${AYNI_SMTP_PORT}
      AYNI_SMTP_USER: ${AYNI_SMTP_USER}
      AYNI_SMTP_PASSWORD: ${AYNI_SMTP_PASSWORD}
    depends_on:
      postgres: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }

  ayni-kyc-service:
    build: ../../services/ayni-kyc-service
    container_name: ayni-kyc-service
    restart: unless-stopped
    environment:
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      AYNI_UMBRAL_SIMILITUD_FACIAL: ${AYNI_UMBRAL_SIMILITUD_FACIAL:-0.80}
    ports: ["8000:8000"]
    depends_on:
      minio: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 20s
      timeout: 5s
      retries: 5
    networks: [ayni]

  ayni-web:
    build: ../../web/ayni-web
    container_name: ayni-web
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8080
    ports: ["3000:3000"]
    depends_on:
      ayni-gateway: { condition: service_started }
    networks: [ayni]

  # ─────────────────────────── Observabilidad ───────────────────────────

  prometheus:
    image: prom/prometheus:latest
    container_name: ayni-prometheus
    restart: unless-stopped
    volumes:
      - ../observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports: ["9090:9090"]
    networks: [ayni]

  grafana:
    image: grafana/grafana:latest
    container_name: ayni-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana-data:/var/lib/grafana
      - ../observability/grafana:/etc/grafana/provisioning:ro
    ports: ["3001:3000"]
    depends_on: [prometheus]
    networks: [ayni]

  loki:
    image: grafana/loki:latest
    container_name: ayni-loki
    restart: unless-stopped
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
      - loki-data:/loki
    ports: ["3100:3100"]
    networks: [ayni]

networks:
  ayni:
    driver: bridge

volumes:
  postgres-data:
  rabbitmq-data:
  minio-data:
  prometheus-data:
  grafana-data:
  loki-data:
