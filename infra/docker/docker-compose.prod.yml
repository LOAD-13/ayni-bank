# Ayni Bank — produccion v1 en AWS (instancia EC2). Ver ADR-0026.
#
# No se ejecuta a mano: lo lanza infra/scripts/desplegar.sh, que el pipeline de
# despliegue invoca por AWS Systems Manager. Diferencias con el compose local:
#
#   - Las imagenes NO se construyen aqui: se descargan de ECR ya construidas,
#     probadas y escaneadas por el pipeline. Lo que se prueba es lo que corre.
#   - PostgreSQL es RDS y los documentos van a S3: no hay contenedores de base
#     de datos ni de MinIO que respaldar ni que perder.
#   - Ningun servicio publica puertos salvo Caddy (80/443).
#   - Los secretos llegan en /opt/ayni/.env, que el script genera en cada
#     despliegue desde Parameter Store y Secrets Manager. Nunca estan en git.

name: ayni-bank

x-java-common: &java-common
  restart: unless-stopped
  networks: [ayni]
  logging: &logs
    driver: json-file
    options: { max-size: "20m", max-file: "5" }

x-java-env: &java-env
  SPRING_PROFILES_ACTIVE: prod
  SPRING_RABBITMQ_HOST: rabbitmq
  SPRING_RABBITMQ_USERNAME: ayni
  SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
  SPRING_DATASOURCE_USERNAME: ${DB_USUARIO}
  SPRING_DATASOURCE_PASSWORD: ${DB_CONTRASENA}
  # Cifrado en transito hasta RDS: sin TLS el conductor se niega a conectar.
  SPRING_DATASOURCE_URL: jdbc:postgresql://${DB_HOST}:5432/ayni?sslmode=require
  JAVA_TOOL_OPTIONS: "-XX:MaxRAMPercentage=70"

services:

  caddy:
    image: caddy:2.10-alpine
    container_name: ayni-caddy
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    environment:
      AYNI_DOMINIO: ${AYNI_DOMINIO}
      AYNI_CORREO_TLS: ${AYNI_CORREO_TLS}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      ayni-web: { condition: service_started }
      ayni-gateway: { condition: service_started }
    logging: *logs
    networks: [ayni]

  rabbitmq:
    image: rabbitmq:3.13-alpine
    container_name: ayni-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ayni
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 15s
      timeout: 10s
      retries: 10
    logging: *logs
    networks: [ayni]

  ayni-gateway:
    <<: *java-common
    image: ${REGISTRO}/ayni/ayni-gateway:${ETIQUETA}
    container_name: ayni-gateway
    environment:
      <<: *java-env
      AYNI_ORIGENES_PERMITIDOS: https://${AYNI_DOMINIO}
      AYNI_JWT_CLAVE: ${AYNI_JWT_CLAVE}
    depends_on:
      ayni-identity-service: { condition: service_healthy }
      ayni-core-banking-service: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/actuator/health"]
      interval: 20s
      timeout: 5s
      retries: 6
      start_period: 40s

  ayni-identity-service:
    <<: *java-common
    image: ${REGISTRO}/ayni/ayni-identity-service:${ETIQUETA}
    container_name: ayni-identity-service
    environment:
      <<: *java-env
      AYNI_KYC_SERVICE_URL: http://ayni-kyc-service:8000
      # La lectura del DNI por OCR corre en la CPU de la instancia: 30 s no alcanzaban y
      # la solicitud quedaba "diferida" aunque las fotos fueran buenas.
      AYNI_KYC_TIMEOUT_EXTRACCION: "90s"
      # Clave del operador que aprueba solicitudes en revision (SSM /ayni/prod/operador-clave).
      # Sin ella, el endpoint del operador no responde.
      AYNI_OPERADOR_CLAVE: ${AYNI_OPERADOR_CLAVE:-}
      AYNI_JWT_CLAVE: ${AYNI_JWT_CLAVE}
      AYNI_CIFRADO_CLAVE: ${AYNI_CIFRADO_CLAVE}
      AYNI_COOKIES_SEGURAS: "true"
      MINIO_ENDPOINT: https://s3.us-east-1.amazonaws.com
      MINIO_ENDPOINT_PUBLICO: https://s3.us-east-1.amazonaws.com
      MINIO_ACCESS_KEY: ${S3_ACCESS_KEY}
      MINIO_SECRET_KEY: ${S3_SECRET_KEY}
      AYNI_BUCKET_KYC: ${AYNI_BUCKET_KYC}
      AYNI_URL_PUBLICA: https://${AYNI_DOMINIO}
      AYNI_CORREO_REMITENTE: Ayni Bank <jloadenegri@gmail.com>
    depends_on:
      rabbitmq: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8081/actuator/health"]
      interval: 20s
      timeout: 5s
      retries: 6
      start_period: 60s

  ayni-core-banking-service:
    <<: *java-common
    image: ${REGISTRO}/ayni/ayni-core-banking-service:${ETIQUETA}
    container_name: ayni-core-banking-service
    environment:
      <<: *java-env
    depends_on:
      rabbitmq: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8082/actuator/health"]
      interval: 20s
      timeout: 5s
      retries: 6
      start_period: 60s

  ayni-notification-service:
    <<: *java-common
    image: ${REGISTRO}/ayni/ayni-notification-service:${ETIQUETA}
    container_name: ayni-notification-service
    environment:
      <<: *java-env
    depends_on:
      rabbitmq: { condition: service_healthy }

  ayni-kyc-service:
    image: ${REGISTRO}/ayni/ayni-kyc-service:${ETIQUETA}
    container_name: ayni-kyc-service
    restart: unless-stopped
    environment:
      MINIO_ENDPOINT: https://s3.us-east-1.amazonaws.com
      MINIO_ACCESS_KEY: ${S3_ACCESS_KEY}
      MINIO_SECRET_KEY: ${S3_SECRET_KEY}
      # Sin esto kyc-service usa el nombre por defecto y S3 responde NoSuchBucket:
      # toda verificacion del DNI acababa en revision manual.
      MINIO_BUCKET_KYC: ${AYNI_BUCKET_KYC}
      AYNI_UMBRAL_SIMILITUD_FACIAL: "0.80"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 20s
      timeout: 5s
      retries: 6
      start_period: 60s
    logging: *logs
    networks: [ayni]

  ayni-web:
    image: ${REGISTRO}/ayni/ayni-web:${ETIQUETA}
    container_name: ayni-web
    restart: unless-stopped
    logging: *logs
    networks: [ayni]

  # ── Observabilidad (AYNI-159) ──────────────────────────────────────────
  # Prometheus y node-exporter solo viven en la red interna. Grafana se publica
  # en /grafana a traves de Caddy, con la contrasena de Parameter Store y sin
  # registro ni acceso anonimo. La configuracion la descarga desplegar.sh del
  # mismo commit, en ./observabilidad.

  ayni-prometheus:
    image: prom/prometheus:v3.4.0
    container_name: ayni-prometheus
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      # Quince dias o 2 GB, lo que llegue antes: el disco de la instancia es de 30 GB.
      - --storage.tsdb.retention.time=15d
      - --storage.tsdb.retention.size=2GB
    volumes:
      - ./observabilidad/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    logging: *logs
    networks: [ayni]

  ayni-grafana:
    image: grafana/grafana:11.6.0
    container_name: ayni-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_CONTRASENA}
      GF_SERVER_ROOT_URL: https://${AYNI_DOMINIO}/grafana/
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_SECURITY_COOKIE_SECURE: "true"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /etc/grafana/provisioning/dashboards/ayni-negocio.json
    volumes:
      - ./observabilidad/grafana/datasources:/etc/grafana/provisioning/datasources:ro
      - ./observabilidad/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on: [ayni-prometheus]
    logging: *logs
    networks: [ayni]

  ayni-node-exporter:
    image: prom/node-exporter:v1.9.1
    container_name: ayni-node-exporter
    restart: unless-stopped
    command:
      - --path.rootfs=/host
    pid: host
    volumes:
      - /:/host:ro,rslave
    logging: *logs
    networks: [ayni]

networks:
  ayni:
    driver: bridge

volumes:
  rabbitmq-data:
  caddy-data:
  caddy-config:
  prometheus-data:
  grafana-data:
