# Prometheus en produccion (AYNI-159). Lo descarga desplegar.sh del commit que
# se despliega, igual que el compose y el Caddyfile.
#
# Todo se raspa por la red interna de Docker: ni Prometheus ni los endpoints
# /actuator/prometheus son accesibles desde internet. Solo Grafana se publica,
# detras de Caddy y con contrasena.
global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    entorno: prod

scrape_configs:
  - job_name: ayni-servicios
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: [ayni-gateway:8080]
        labels: { servicio: ayni-gateway }
      - targets: [ayni-identity-service:8081]
        labels: { servicio: ayni-identity-service }
      - targets: [ayni-core-banking-service:8082]
        labels: { servicio: ayni-core-banking-service }
      - targets: [ayni-notification-service:8083]
        labels: { servicio: ayni-notification-service }

  - job_name: ayni-kyc
    metrics_path: /metrics
    static_configs:
      - targets: [ayni-kyc-service:8000]
        labels: { servicio: ayni-kyc-service }

  # CPU, memoria, disco y red de la instancia EC2.
  - job_name: host
    static_configs:
      - targets: [ayni-node-exporter:9100]
        labels: { servicio: ec2 }

  - job_name: prometheus
    static_configs:
      - targets: [localhost:9090]
